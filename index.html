<!doctype html>
<html lang="en" data-tn-boot="loading">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover lets the page paint under a notch or a home indicator.
      The safe-area insets below then pull the *canvas* back inside the usable
      area, so the sky and ground still reach the physical edges of the screen
      while nothing playable hides behind hardware (ADR-0002).
      initial-scale=1 with no maximum-scale: pinch zoom stays available, which
      text scaling 100-200% depends on.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The browser chrome tint, applied before the bundle runs. Kept equal to
         the config's theme.sky by tests/unit/bootstrap/pre-boot-theme.test.ts;
         app/bootstrap rewrites it from the parsed config at boot. -->
    <meta name="theme-color" content="#0f3057" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="TrueNorth - a portrait-first game that teaches the official Canadian citizenship test."
    />
    <title>TrueNorth</title>

    <style>
      /*
        The app shell. Everything here is layout and page chrome; the rotate
        overlay and the live region carry their own styles from app/ui.
      */

      :root {
        /*
          Pre-boot paint. Overwritten by app/bootstrap from
          content/game.config.json as soon as the bundle has parsed it; these
          literals are only ever the first frame, before any script has run.

          They are a deliberate copy of that file's `theme` block, because the
          browser paints this document long before it could read JSON. The copy
          is not left on trust: tests/unit/bootstrap/pre-boot-theme.test.ts
          fails if these three values and the theme-color meta below stop
          matching the config. Change the config, change these, or the unit
          suite goes red naming the file to edit.
        */
        --tn-sky: #0f3057;
        --tn-ground: #12352a;
        --tn-horizon: #e8eef4;
        --tn-page: #060d16;

        /*
          The colour of the canvas's first row, which the band above the canvas
          is painted with (ADR-0044). Not a literal: before boot the canvas is
          the boot scene, whose first row is --tn-sky. app/bootstrap writes the
          scene's measured value over this once a level draws.
        */
        --tn-sky-top: var(--tn-sky);

        /*
          The land at the horizon, and the three heights it occupies, as a
          fraction of the page. Same pre-boot story as the colours above:
          app/adapters/phaser computes all four from the palette and the ridge
          profile and app/bootstrap writes them over these, so the literals are
          only ever the first frame. `--tn-land` is a shade of `--tn-ground`;
          tests/unit/bootstrap/pre-boot-theme.test.ts fails if it stops being
          the shade the renderer actually uses.
        */
        --tn-land: #081813;
        --tn-land-crest: 68.190%;
        --tn-land-skirt: 69.688%;
        --tn-land-end: 92.083%;

        /*
          The rest of the canvas's sky, as gradient stops #game::before splices
          into its ramp. Empty until a level reports, which leaves the plain
          two-stop ramp that shipped before.

          A level's sky is not a straight line from its first row to its ground:
          it has a hill line and a skyline in it, and a two-stop ramp ran through
          both. Measured at 1440x900, the step between the side panel and the
          canvas beside it grew from 0 at the top row to 25 on Halifax and 33 on
          the North by mid-screen. app/adapters/phaser/sky-top.ts works the stops
          out from what the scene draws.

          Declared empty rather than left unset: `var()` with no declaration and
          no fallback is invalid at computed-value time, and this one sits in the
          middle of a stop list, so it would take the whole gradient down.
        */
        --tn-sky-stops: ;

        /* Mirrored as custom properties so the debug overlay can print the
           insets the browser actually reported. */
        --tn-safe-top: env(safe-area-inset-top, 0px);
        --tn-safe-right: env(safe-area-inset-right, 0px);
        --tn-safe-bottom: env(safe-area-inset-bottom, 0px);
        --tn-safe-left: env(safe-area-inset-left, 0px);

        /*
          Where the canvas sits, for the letterbox gradients #game::before
          paints (see that rule). FIT + CENTER_BOTH inside #game's safe-area
          insets, so the canvas is as wide as #game on a phone taller than 9:16
          and as tall as #game on a window wider than it. 16 / 9 is the design
          resolution, 1080x1920 (ADR-0002).

          On :root, and that placement is load-bearing rather than tidy. A custom
          property's own `var()`s are substituted at computed-value time on the
          element that DECLARES it, not where it is used. app/bootstrap writes
          --tn-sky-stops on :root and every stop in it is positioned with
          `calc(var(--tn-canvas-top) + ...)`, so :root has to be an element these
          three resolve on. Declared on body, as they were, they resolve to
          nothing on :root and the whole letterbox gradient becomes invalid.
          #game and the body still inherit them, so nothing else moves.
        */
        --tn-game-height: calc(100dvh - var(--tn-safe-top) - var(--tn-safe-bottom));
        --tn-game-width: calc(100vw - var(--tn-safe-left) - var(--tn-safe-right));
        --tn-canvas-height: min(var(--tn-game-height), var(--tn-game-width) * 16 / 9);
        --tn-canvas-top: calc(
          var(--tn-safe-top) + (var(--tn-game-height) - var(--tn-canvas-height)) / 2
        );
        --tn-canvas-bottom: calc(var(--tn-canvas-top) + var(--tn-canvas-height));
      }

      html {
        height: 100%;
        background-color: var(--tn-page);
        /* overscroll-behavior has to be on the root as well as the body, or the
           browser propagates the body value and pull-to-refresh survives. */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;

        /*
          Where the canvas sits is declared on :root, not here. See that block:
          --tn-sky-stops is written on :root and positions its stops with
          var(--tn-canvas-top), which only resolves on an element that declares
          it. The body and #game::before inherit all three from :root.

          The gradients themselves are painted by #game::before, below, and not
          here: the level is dimmed by a filter on #game while a card is open
          (ADR-0041), and a filter on #game cannot reach the body's background.
          Painted here, the band above the canvas stayed bright over a dimmed
          level (ADR-0044).
        */
        background-color: var(--tn-page);

        color: #e9f1f8;
        /* The UI face's stack, character for character (common/type-faces.ts,
           ADR-0066 §1): the faces are declared by the script, and anything
           drawn before it runs falls to the generic. No device family is
           named; tests/unit/ui/type-stacks.test.ts holds this line to that. */
        font-family: "Atkinson Hyperlegible", "TrueNorth Text Fallback", sans-serif;

        /* One-thumb play: the browser must not claim the gesture. `none` also
           removes the 300 ms double-tap-to-zoom delay on the playfield. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /*
        The canvas host. Insets rather than padding: Phaser measures the parent
        with getBoundingClientRect(), which includes padding, so padding would
        let the canvas slide under a notch. Insets make the border box itself
        the safe area.
      */
      #game {
        position: fixed;
        top: var(--tn-safe-top);
        right: var(--tn-safe-right);
        bottom: var(--tn-safe-bottom);
        left: var(--tn-safe-left);
        touch-action: none;
      }

      /*
        The letterbox: the desktop side panels, and the bands above and below
        the canvas on a phone taller than 9:16 (ADR-0002, ADR-0044).

        The canvas is Scale.FIT and is never stretched, so a window wider than
        9:16 leaves letterbox space to the left and right of it. That space is
        these gradients: the same colours the scene paints, running
        top-to-bottom over the same box height, so sky, land and ground read as
        continuing past the canvas edge. No second camera, no extra draw calls.

        Two layers, front to back. The first is the land under the horizon —
        opaque from the crest to the foot of the hills, then fading out exactly
        where the scene's own land fades back into the gradient. Without it the
        hills stopped dead at the letterbox edge and a wide window showed the
        canvas as a framed picture. The second is the sky-to-ground ramp. The
        heights line up wherever they are visible: side panels exist only when
        the viewport is wider than 9:16, and such a viewport is
        height-constrained under FIT, so the canvas is exactly as tall as this
        box. On a portrait phone the land layer is hidden behind the canvas. See
        `landBand` in app/adapters/phaser.

        A phone TALLER than 9:16 letterboxes the other way: a band ABOVE and
        BELOW the canvas (75 CSS px each at 390x844). The ramp runs over the
        CANVAS box, not the page, so the band above it is flat. Its colour is
        --tn-sky-top: what the canvas actually draws on its first row, reported
        by the scene. That is the untinted sky image on every shipped level, and
        --tn-sky, the tinted theme sky, was a visible step away from it.

        Between those two ends sits --tn-sky-stops: what the canvas draws down
        the REST of its sky, reported by the scene as gradient stops. Two stops
        made the panel exact on the first row and then ran a straight line to the
        ground through the hill line and the skyline, which no level's sky is on
        — measured at 1440x900, the step between panel and canvas grew from 0 at
        the top to 25 on Halifax and 33 on the North by mid-screen. The stops are
        positioned against the canvas box for the same reason the ends are, so a
        phone's flat bands are unaffected. `var(--tn-sky-stops, )` with an empty
        fallback, and an empty declaration on :root: this substitutes into the
        middle of a stop list, where an unset property would make the whole
        gradient invalid and paint no letterbox at all.

        Painted by a pseudo-element of #game, not by body, so the filter that
        dims #game while a card is open (ADR-0041) dims the letterbox with the
        level. Its box is #game pushed out by the safe-area insets, which is the
        whole viewport, so the stops measured from the top of the page land
        where they did on body; it reaches under a notch and a home indicator.
        z-index -1 keeps it under the canvas inside #game's stacking context
        (fixed positioning makes one), and it takes no pointer events. Forced
        colours leave it alone for the same reason they leave the canvas alone:
        it is the picture, not text.
      */
      #game::before {
        content: '';
        position: absolute;
        top: calc(-1 * var(--tn-safe-top));
        right: calc(-1 * var(--tn-safe-right));
        bottom: calc(-1 * var(--tn-safe-bottom));
        left: calc(-1 * var(--tn-safe-left));
        z-index: -1;
        pointer-events: none;
        forced-color-adjust: none;
        background:
          linear-gradient(
              180deg,
              transparent var(--tn-land-crest),
              var(--tn-land) var(--tn-land-crest),
              var(--tn-land) var(--tn-land-skirt),
              transparent var(--tn-land-end)
            )
            no-repeat,
          linear-gradient(
              180deg,
              var(--tn-sky-top) 0,
              var(--tn-sky-top) var(--tn-canvas-top),
              var(--tn-sky-stops, )
              var(--tn-ground) var(--tn-canvas-bottom),
              var(--tn-ground) 100%
            )
            no-repeat;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      /* The DOM layer above the canvas: live region now, question cards and
         menus in slice 1. Transparent to pointers until a child opts in. */
      #ui {
        position: fixed;
        top: var(--tn-safe-top);
        right: var(--tn-safe-right);
        bottom: var(--tn-safe-bottom);
        left: var(--tn-safe-left);
        z-index: 10;
        pointer-events: none;
        touch-action: manipulation;
      }

      #ui > * {
        pointer-events: auto;
      }

      .tn-noscript {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--tn-page);
        color: #ffffff;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <!-- The Phaser canvas is inserted here and is aria-hidden; see app/adapters/phaser. -->
    <div id="game"></div>
    <!-- Accessible DOM above the canvas: the live region, dialogs, cards, menus. -->
    <div id="ui"></div>

    <noscript>
      <div class="tn-noscript">
        <p>
          TrueNorth needs JavaScript to run.<br />
          Please turn it on and reload the page.<br /><br />
          <span lang="fr"
            >TrueNorth a besoin de JavaScript.<br />
            Activez-le, puis rechargez la page.</span
          >
        </p>
      </div>
    </noscript>

    <script type="module" src="/app/bootstrap/main.ts"></script>
  </body>
</html>
