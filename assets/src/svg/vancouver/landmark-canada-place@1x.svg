<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" shape-rendering="geometricPrecision">
  <title>The cruise-ship terminal and convention centre on the Vancouver waterfront: five white fabric sails on masts over a long two-level white pier building, standing on piles in the harbour, with the National Flag of Canada on the promenade where the reference shows it. Drawn from refs/vancouver/canada-place-from-the-west.jpg, canada-place-pier-at-dusk.jpg and five-sails-close.jpg, and simplified. Every vertical is MEASURED against H = the sail peak to the waterline in one column at the near end of the primary reference: sails 0.384 H, deck edge 0.070 H, the block 0.411 H, piles 0.135 H, mast spacing 0.384 H. FIVE sails, because the count is the identification. NO LETTERING AND NO WORDMARK: the building carries its name in steel letters on its west face in one reference and this project draws no text anywhere. THE FILE IS 700 TALL AND ITS BOTTOM 180 ROWS ARE DELIBERATELY EMPTY: level-scene.ts places a POI hero with origin (0.5, 1) on the ground line and draws it OVER the parallax, so a hero drawn tight to its own base would stand on the promenade and hide the seawall, its balustrade and its people. The empty band puts the pier's waterline at world 1000, inside the inlet tile's water, and lets the seawall pass in front of it - which is the view from the seawall and is what the building actually is. It costs 1.07 MiB and the sheet says so.</title>
