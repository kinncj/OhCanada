<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" shape-rendering="geometricPrecision">
  <title>Three moored sailing boats in a harbour marina, all lying the same way with their BOWS TO THE LEFT: white hulls with a raked stem that is the furthest-forward point of each boat, a sheer that rises to it, and a SHORT reverse transom aft, so which end is the bow cannot be read backwards. A narrow dark boot stripe sits AT THE WATERLINE along the bottom of each hull, not up on the topside - a blind pass read the earlier drawing, whose dark band ran high across the hull like a sheer stripe over three bare masts, as an inshore FISHING FLEET, and a white hull with no boot stripe is exactly what a fishing boat has. Each carries one bare mast forward of amidships and ONE BOOM AT ITS FOOT RUNNING AFT ONLY, drawn under the mast so it cannot appear to cross it or project forward: the same pass read the earlier boom, which stood out on both sides of the mast, as an OUTRIGGER. No shrouds, no stays, no rigging lines. Low cabin trunks with two dark windows each, over open water, with two mooring buoys and the stone edge of a seawall walk across the bottom of the frame. TYPES, not named vessels: no name, no sail number, no class insignia, no burgee, no flag and no lettering of any kind, and no figure on any deck. Drawn from the marina in assets/refs/vancouver/coal-harbour-and-the-north-shore.jpg and seawall-path-and-harbour.jpg; see assets/refs/references.json, subject marina-boats. POI hero, present at every visual tier.</title>

