<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" shape-rendering="geometricPrecision">
  <title>Three moored sailing boats in a harbour marina: white hulls with a dark boot stripe and a sheer that rises to the bow, low cabin trunks with two dark windows each, a single bare mast on each with its boom LOW AT THE MAST FOOT RUNNING AFT over the cabin top, which is what separates a moored sloop from a fishing boat's derrick - a blind pass read the earlier drawing, whose boom floated halfway up the mast and pointed forward, as fishing boats; no shrouds, stays or rigging lines, lying at a floating timber dock with mooring cleats, over open water, with the stone edge of a seawall walk across the bottom of the frame. TYPES, not named vessels: no name, no sail number, no class insignia, no burgee, no flag and no lettering of any kind. Drawn from the marina in assets/refs/vancouver/coal-harbour-and-the-north-shore.jpg and seawall-path-and-harbour.jpg; see assets/refs/references.json, subject marina-boats. POI hero, present at every visual tier.</title>

