  <title>A bulk carrier lying in a harbour: a long dark red hull with a black boot stripe at the waterline and a flared bow, a line of raised hatch covers down the weather deck, four pedestal deck cranes with their jibs stowed, and a white superstructure aft under a red funnel with a black cap and a mast. A TYPE, not a named ship: no name, no port of registry, no draught marks, no funnel device, no house flag, no ensign and no lettering of any kind. Drawn from the ships in assets/refs/vancouver/canada-place-and-the-north-shore.jpg and coal-harbour-and-the-north-shore.jpg; see assets/refs/references.json, subject bulk-carrier. POI hero, present at every visual tier.</title>

