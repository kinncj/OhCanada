<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" shape-rendering="geometricPrecision">
  <title>Atlantic coast sky over Peggy's Cove: ONE FLAT sky-base field with five rows of stratocumulus ROLLS - lumpy-topped, flat-based cloud bars in regular rows, smaller and closer together toward the horizon. Rolls rather than cumulus, cirrus or cloud banks, because Halifax, the Alberta foothills and the Prairies have taken cumulus, Vancouver has cirrus and Winnipeg and Toronto have banks, and this sky has to be tellable from all six at a glance. MEASURED off refs/peggys-cove/lighthouse-elevation.jpg, which is a rippled stratocumulus deck, and lightened to a bright day because that photograph is fully overcast and refs/peggys-cove/granite-barrens-and-sea.jpg is the weather this level is set in. FLAT, NOT BANDED: at the low preset this level keeps the sky and the granite barrens, and the barrens tile is transparent everywhere above world 1024, so there is no nearer opaque layer anywhere inside this band to hide a band step behind. The flat field IS content/levels/peggys-cove.json theme.sky. World y 0..900. No roll touches x 0 or x 1080, so the desktop side-panel seam is flat sky-base.</title>
