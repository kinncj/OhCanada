<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" shape-rendering="geometricPrecision">
  <title>Atlantic coast sky over Peggy's Cove: ONE FLAT sky-base field and a scattered deck of fifteen stratocumulus ROLLS - lumpy-topped, flat-based cloud bars, larger and wider apart high up, smaller, flatter and closer together toward the horizon. SCATTERED, NOT IN ROWS: build one's rolls sat in a lattice of five rows and read as a grid (live-site audit, 2026-09-14), so every roll now has its own height and the gaps between them differ. Rolls rather than cumulus, cirrus or cloud banks, because Halifax, the Alberta foothills and the Prairies have taken cumulus, Vancouver has cirrus and Winnipeg and Toronto have banks. Flat field because at the low preset this level keeps the sky and the granite barrens, and the barrens tile is transparent above world 1024, so a band step would show. The field is exactly the level document's theme.sky. Every roll is kept inside x 8..1072, so the extreme left and right columns are flat sky-base and the tile repeats without a seam. World y 0..900.</title>
