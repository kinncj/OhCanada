  <title>A glacial erratic on the granite barrens: one large rounded pale boulder and a smaller one beside it, sitting on bare jointed granite pavement, with grass in the joints and a shallow tide pool in front. Landform only: no cairn, no stacked or balanced stones, no inuksuk, no marker, no carving, no lettering and no figure of any kind at any scale - assets/style/peggys-cove-level.md section 0 and docs/content-review.md. Drawn from assets/refs/peggys-cove/granite-barrens-and-sea.jpg and lighthouse-on-the-granite.jpg; see assets/refs/references.json, subject granite-erratic. POI hero, present at every visual tier.</title>

