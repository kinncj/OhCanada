<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" shape-rendering="geometricPrecision">
  <title>A glacial erratic and a tide pool on bare granite barrens: one large boulder resting ON the pavement, and a second, smaller boulder of a different shape standing clear of it on the same rock with bare pavement between them. Neither mass rests on the other and neither is stacked or balanced. TWO THINGS ARE DELIBERATE AND BOTH ARE CORRECTIONS. First, THE BOULDERS ARE THE WARM `limestone` RAMP AND THE PAVEMENT IS THE NEUTRAL `path` RAMP. Both were drawn from `path` before, so a boulder and the ground under it were the same near-neutral grey and the mass had no edge of its own; `path` is also the one ramp palette.json declares near-neutral and exempts from the saturation gain, so a subject drawn wholly from it breached CLAUDE.md's saturated palette as well. `limestone` is the pinkish-warm grey this palette already carries and it is what Peggy's Cove granite actually is - `stone` was tried first and is too yellow: it made the mass read as a loaf. Second, THE OUTLINE IS LUMPY AND ITS CREST IS OFF CENTRE. A single smooth arc is a dome, and a blind pass twice read this subject as smooth grey domes it could not name. The big mass now has a long shallow left flank with a saddle in it, a crest well right of centre, and a blunt steep right shoulder; the small one is a low wedge with a flat top, a different shape rather than a smaller copy. The joints are SHORT and STRAIGHT and follow the rock's grain - the dark band that used to curve across the big mass's face read as an arched opening, which is most of why the boulder read as built. Landform only: no cairn, no stacked or balanced stones, no inuksuk, no marker, no carving, no lettering and no figure of any kind at any scale - assets/style/peggys-cove-level.md section 0 and docs/content-review.md. No lichen, speckle or surface pattern: the rock reads from its planes and its joints. Grass grows only in the joints; a shallow still tide pool lies in front. Drawn from assets/refs/peggys-cove/granite-barrens-and-sea.jpg and lighthouse-on-the-granite.jpg; see assets/refs/references.json, subject granite-erratic. POI hero, present at every visual tier.</title>

