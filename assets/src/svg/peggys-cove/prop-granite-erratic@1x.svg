<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" shape-rendering="geometricPrecision">
  <title>A glacial erratic on the granite barrens: one large pale boulder built from three glacially rounded PLANES - a broad top plane sloping up to a crest right of centre, a long shallow left flank, and a steep shaded right face with a blunt shoulder - and a second, smaller boulder of a different shape, a low wedge, standing well clear of it on the same pavement with bare rock between them. Both rest on bare jointed granite slabs that run behind and in front of them, so neither stands on a single straight line. Grass grows only in the joints; a shallow tide pool with a broken, irregular rim and a partial rockweed edge lies in front. Landform only: no cairn, no stacked or balanced stones, no inuksuk, no marker, no carving, no lettering and no figure of any kind at any scale - assets/style/peggys-cove-level.md section 0 and docs/content-review.md. Neither mass rests on the other. No lichen, speckle or surface pattern: the rock reads from its planes and its joints. Drawn from assets/refs/peggys-cove/granite-barrens-and-sea.jpg and lighthouse-on-the-granite.jpg; see assets/refs/references.json, subject granite-erratic. POI hero, present at every visual tier.</title>

