<svg xmlns="http://www.w3.org/2000/svg" width="480" height="900" viewBox="0 0 480 900" shape-rendering="geometricPrecision">
  <title>Peggy's Point Lighthouse: a squat, white, tapered octagonal concrete tower carrying a RED lantern room with a red conical roof and a red ball finial, a wide white gallery deck on a concave corbel with a dark railing, three narrow windows up the left face, and a small white entry porch at the foot. POI hero, non-repeating, 1x pinned, drawn at 480x900 with the tower 840 tall from finial tip to base. EVERY RATIO IS MEASURED on refs/peggys-cove/lighthouse-elevation.jpg, in the column through the tower's axis, with H = the finial tip at y150 to the foot at y690 = 540 px. The identification lives in TWO proportions and they are the ones a cartoon lighthouse always gets wrong: the tower is only 2.37 base widths tall (540/228), where the default drawing is four to six; and the red top is 0.30 of the whole height (164/540), so nearly a third of this lighthouse is its lantern. Get either wrong and this is a generic lighthouse. NO LETTERING, NO PLAQUE, NO SIGN and no light beam is drawn. The red is the `flag-red` ramp: the lit decile of the roof cone on the reference measures hsl(344,92%,32%) against flag-red-shade's hsl(346,72%,34%) - two degrees of hue and two points of lightness, the saturation gap being that photograph's own edit - so no lantern-red ramp was added.</title>
