<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="260" viewBox="0 0 1760 260" shape-rendering="geometricPrecision">
  <title>The open Atlantic beyond the mouth of the cove: a pale haze band at the horizon, water in three flat tones deepening toward the viewer with straight ripple bars, a low wooded headland running out to the right, two granite skerries with surf collars, and two plain white inshore boats. World y 700..960; the cove tile is opaque from world 866, so 166 rows of this one are ever seen. EVERY OBJECT HERE IS A TYPE - the tile repeats every 1760 px, so no boat carries a name, a number, a hull livery or a funnel mark, and the headland is a landform and not a named one. Water MEASURED at hsl(202,24%,43%) on refs/peggys-cove/granite-barrens-and-sea.jpg against water-base's hsl(199,62%,45%): the hue is right and the photograph is less saturated than the ramp, which is the same gap vancouver/layer-30-inlet.svg records. The headland is the `ice` ramp, used for hazy distance exactly as vancouver/layer-20-north-shore.svg uses it.</title>
