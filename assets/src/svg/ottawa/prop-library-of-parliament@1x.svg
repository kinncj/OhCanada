<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" shape-rendering="geometricPrecision">
  <title>A round Gothic Revival library on a hillside in winter: a sixteen-sided buff sandstone drum, drawn ROUND - its wall facets narrow toward each turn, its cornice and base rings curve, its tone ramps from lit on the left to shaded on the right, and six stepped buttresses of decreasing width march around the curve into tall pinnacles that stand in front of the roof. Three tall pointed-arch windows sit in the three facets that face the viewer; the turning facets are plain stone. Over it a very steep polygonal dark roof with radiating ribs on the same recession, a ring of five gabled dormers with pointed-arch heads interlocking with the pinnacles, and a small stone lantern with a plain spike finial at the apex. Snow on every upward surface. NO CROSS, no religious emblem, no statue, no clock, no flag and no lettering: this is a library, and a steep polygonal roof over pointed windows is one wrong addition away from a chapter house of a cathedral. Drawn from assets/refs/ottawa/parliament-hill-north-library.jpg and parliament-hill-skyline.jpg; see assets/refs/references.json, subject library-of-parliament. POI hero, present at every visual tier.</title>

