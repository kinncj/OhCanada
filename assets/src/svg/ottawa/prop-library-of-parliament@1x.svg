<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" shape-rendering="geometricPrecision">
  <title>A round Gothic Revival library on a hillside in winter: a polygonal buff sandstone drum ringed by stepped buttresses with pinnacles, three tall pointed-arch windows between them, a deep stone cornice, and a very steep polygonal dark roof with radiating ribs, a ring of small gabled dormers with pointed arch heads, and a small stone lantern and plain spike finial at the apex, with snow on every upward surface. NO CROSS, no religious emblem, no statue, no clock, no flag and no lettering: this is a library, and a steep polygonal roof over pointed windows is one wrong addition away from a chapter house of a cathedral. Drawn from assets/refs/ottawa/parliament-hill-north-library.jpg; see assets/refs/references.json, subject library-of-parliament. POI hero, present at every visual tier.</title>

