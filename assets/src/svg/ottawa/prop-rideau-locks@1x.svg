  <title>A canal lock in winter: a masonry chamber between two coursed stone walls with snow lying on their copings and a black iron handrail along each, a pair of closed white timber gates meeting at a mitre across the chamber with three rails on each leaf, the long white balance beams swung out over the walls on their pivot posts, a band of pale frozen ice with straight sheen bars filling the chamber below the gates, and a low snow bank along the near edge. No lettering, no plaque, no flag, no figure, no boat. Drawn from assets/refs/ottawa/rideau-canal-ottawa-locks.jpg; see assets/refs/references.json, subject canal-lock. POI hero, present at every visual tier.</title>

