<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" shape-rendering="geometricPrecision">
  <title>The pavilion at Dow's Lake, the wide southern end of the Rideau Canal Skateway in Ottawa: a long, low, two-storey building standing on piles over the frozen lake, under a broad shallow metal roof with a raised ridge monitor and deep overhanging eaves, with a continuous band of dark glass, an open raised terrace at its near end, a long external stair from the deck to the upper floor, a short stair from the ice up to the deck, globe lamps along the deck, and in front of it the CLEARED SKATING LANE: open ice scored by long crossing skate-blade tracks, bounded along its far edge by a low swept snow windrow with the skateway's own small spruces standing on it, and two plain plank skate-change benches set on the ice. THE LANE IS THE CORRECTION THIS BUILD EXISTS FOR, 2026-09-24: blind run 7e6b1463748d4299 read the previous build, whose ice was a 60 px strip with six straight bars, as an Arctic building on permafrost piles, because nothing in the frame said the ice was skated. The building is the same drawing at 0.82 of its first size, raised so the lane has room; the lane, the blade tracks, the windrow, the benches and the ice stair are each taken from the references rather than invented - the tracks and benches from rideau-canal-skateway-ice.jpg, the windrow and the lane spruces from dows-lake-skateway-lane.jpg, the ice stair from dows-lake-pavilion-elevation.jpg. A BUILDING TYPE, not an operated business: no sign, no wordmark, no emblem, no lettering, no kilometre post and no figure. See assets/refs/references.json, subject dows-lake. POI hero, present at every visual tier.</title>

