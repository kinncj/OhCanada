<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" shape-rendering="geometricPrecision">
  <title>The pavilion at Dow's Lake, the wide southern end of the Rideau Canal Skateway in Ottawa: a long, low, two-storey building standing on piles over the water, under a broad shallow metal roof with a raised ridge monitor and deep overhanging eaves, with a continuous band of dark glass, an open raised terrace at its near end, a long external stair from the ice-level deck to the upper floor, globe lamps along the deck, and the skateway's own line of small spruces set into the open ice in front of it. A BUILDING TYPE, not an operated business: no sign, no wordmark, no emblem, no lettering and no figure. Drawn from assets/refs/ottawa/dows-lake-pavilion-elevation.jpg, dows-lake-pavilion-deck-and-stair.jpg and dows-lake-skateway-lane.jpg; see assets/refs/references.json, subject dows-lake. POI hero, present at every visual tier.</title>

