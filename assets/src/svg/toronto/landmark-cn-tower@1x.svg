<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1020" viewBox="0 0 700 1020" shape-rendering="geometricPrecision">
  <title>A very tall slender concrete communications tower: a tapered hexagonal shaft splaying into legs at its foot, a wide observation pod about three fifths up carrying two dark glass bands and a fat white radome as its widest element, a much smaller pod higher up the shaft, and a long tapering antenna mast running from the observation pod to the tip. At its foot, a low white domed stadium in front of the tower, a glazed block and a street tree. The POI hero: present at every visual tier, on every device, because it is a POI artKey and not a parallax layer, and it is the only thing in this level that names a city.</title>
