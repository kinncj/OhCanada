<svg xmlns="http://www.w3.org/2000/svg" width="860" height="364" viewBox="0 0 860 364" shape-rendering="geometricPrecision">
  <title>A Toronto low-floor streetcar standing on rails set in the street, seen from the front three-quarter: the cab end faces left, lit, with a red roof cap, a white brow band, a tall dark windscreen, a white lamp band with round lamps and a red bumper; the long flank recedes to the right in the same livery - red roof band, white band, dark window band broken by pale pillars, white band, red skirt - divided into five modules by wide black articulation bellows, a long cab module at each end and shorter modules between. Drawn from refs/toronto/streetcar-beside-older-car.jpg (the view and the cab front) and streetcar-flank.jpg (the flank band heights, measured on the cab module against its own body height). NO FLEET NUMBER, NO DESTINATION SIGN, NO TRANSIT LOGO and no lettering of any kind; no trolley pole or pantograph, because this level draws no overhead wire. POI hero, present at every visual tier.</title>
