<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" shape-rendering="geometricPrecision">
  <title>Nathan Phillips Square and Toronto City Hall, seen from the square: two curved towers of unequal height facing each other, the shorter on the left, each a tall dark glass face whose floor lines curve, framed by pale ribbed concrete end strips; between them a low white saucer-shaped council chamber standing on a long podium with a pale fascia over a dark colonnade; in front, the square's paving and its reflecting pool. Drawn from refs/toronto/square-winter-rink-and-towers.jpg (the view from the square) and city-hall-massing-aerial.jpg (the massing, the saucer and the podium). MEASURED against H = the shorter tower's height above the podium: taller tower 1.28 H, tower width 0.44 H, gap 0.12 H, saucer 0.55 H wide and 0.14 H high, podium 0.18 H. The pool's three concrete arches are NOT drawn: they span the pool north-south and are edge-on from this side. No sign, no city-name letters, no flag and no lettering of any kind. POI hero, present at every visual tier.</title>
