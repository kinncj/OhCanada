  <title>The waterfront trail the player rides: an asphalt path carrying a green line, a blue line, a dashed centre line, bicycle marks and direction arrows, with a planted verge, a kerb, young street trees, curved-arm lamp standards, benches, a bike rack holding two bicycles, one wayfinding post, two people riding and one walking. GENERIC BY CONSTRUCTION - this tile repeats every 1440 px, so nothing on it is a named or recognisable building and there is no lettering, no livery and no wordmark: the bicycles in the rack are drawn in palette colours and carry no operator colour. World y 900..1300; local y 380 is the level ground line and the rows below it sit behind the ground polygon.</title>
