  <title>A big-city downtown skyline: sixteen generic towers in pale concrete, dark glass and blue-green glass, with flat tops, crowns, setbacks and plant enclosures, standing out of an opaque haze band. GENERIC BY CONSTRUCTION - this tile repeats every 1800 px, so not one of these towers is a recognisable building and none of them is the landmark: the landmark is a separate, non-repeating POI hero and is the only thing in this level that names a city. World y 560..980; the haze foot from world 880 down is opaque, which is what lets the sky layer band below it.</title>
