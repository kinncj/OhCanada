  <title>A small harbour tug lying alongside a timber boardwalk edge: a bluff-bowed black hull with a heavy rubbing strake and a row of tyre fenders hung over the side, a buff bulwark rail, a buff deckhouse with a wheelhouse and a long window band above it, a tall rounded red funnel with a black cap aft of the wheelhouse, a short mast with a crosstree and a masthead light, a towing winch on the aft deck, and a mooring line running to a black bollard standing on the deck. A TYPE, not a named vessel: no name, no house flag, no funnel device, no hull number and no lettering of any kind. Drawn from assets/refs/halifax/waterfront-boardwalk.jpg and waterfront-harbour.jpg; see assets/refs/references.json, subject harbour-tug. POI hero, present at every visual tier.</title>

