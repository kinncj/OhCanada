<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" shape-rendering="geometricPrecision">
  <title>A dockside passenger terminal: a three-storey red brick block with a stone-coped parapet, stone banding and a rhythm of sash windows, a streamlined pale entrance pylon with a curved canopy and a small balcony, long low pier sheds with monitor roofs running away on both sides, the white superstructure, two buff funnels and two masts of an ocean liner berthed alongside and rising above the shed roof, and a dark green heritage passenger coach standing on the pier track in front. NO LETTERING, NO EMBLEM AND NO CLOCK SIGN: the building carries painted lettering and a round emblem in life, and both are the operating institution naming itself. See assets/refs/references.json, subject pier-21, and assets/style/halifax-level.md section 6 for why this subject is not asked to carry blind identification of a place.</title>
