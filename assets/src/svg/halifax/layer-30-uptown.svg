  <title>The town on the slope between the hill and the water: steep-gabled houses with dormer rhythm, flat-roofed mid-rise blocks and one plain parish steeple, in pale distant tones. GENERIC BY CONSTRUCTION - this tile repeats every 1800 px, so nothing on it is a named or recognisable building: the steeple carries no cross, clock or tracery, and there is no dome, no fort and no tower. World y 700..960, in two rows: the feet of the upper row at world 876 and a lower run of roofs meeting the wharves at world 958.</title>
