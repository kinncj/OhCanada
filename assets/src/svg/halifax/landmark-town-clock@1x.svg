  <title>A three-stage white clapboard clock tower on a grassy hillside: a rectangular clapboard base with sash windows and a stone rubble plinth pierced by one arch, a round colonnaded gallery of six columns under a green copper rim, an octagonal drum carrying a deep blue dial with gold hands and four gold marks, an open arched belfry with two bells above it, and a green copper ogee dome under a balustraded cupola and a gold ball. Every proportion is a measured fraction of the base building width; see assets/refs/references.json, subject town-clock. The POI hero: present at every visual tier, on every device, because it is a POI artKey and not a parallax layer.</title>
