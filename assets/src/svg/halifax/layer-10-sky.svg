  <title>Halifax summer sky: one flat sky-base field and seven cumulus. FLAT ON PURPOSE, and it is a departure from Ottawa and Quebec City, which band their skies. A banded sky needs every step to sit behind a nearer OPAQUE layer at EVERY tier, and the only layer guaranteed beside this one at the low preset is layer-40-quayside, which is transparent along its own top edge. One flat field has no step to hide, and it is exactly palette.json levelTheme halifax-summer sky, so dropping this layer at the medium or low preset changes nothing above the roofline. World y 0..880. Extreme left and right columns are flat band colour.</title>
