<svg xmlns="http://www.w3.org/2000/svg" width="600" height="446" viewBox="0 0 600 446" shape-rendering="geometricPrecision">
  <title>Walk, frame 4 of 4: a saddled bay ranch horse seen from its near side: a quarter-horse type with a deep round barrel, a short thick neck carried forward, the head angled down, black mane, tail and lower legs, and a tan western saddle with a horn, a square skirt, a fender, a cinch and an open stirrup, on a felt pad; a plain leather bridle and one rein running back to where the rider holds it above the horn. Proportions MEASURED on assets/refs/alberta-foothills/quarter-horse-side-elevation.jpg against W = the withers height; the saddle and the rider's seat from cow-horse-under-western-saddle.jpg. Never traced. The rider is the player, posed by the rig (horse/*) and drawn IN FRONT of this file, which is a frame of the behind layer of a ride (ADR-0031, ADR-0035); the rider's sole line rests on the anchor at (258, 270), on the stirrup tread, and everything in the group "seat" is drawn identically in every frame so the rider never leaves it. No brand, no lettering, no outline, because it is not a character. The stride from Muybridge plate 574 (horse-walking-muybridge-plate-574.jpg), a lateral four-beat walk sampled a quarter stride apart: three hooves on the ground and the far hind in the air.</title>
