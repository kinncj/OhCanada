<svg xmlns="http://www.w3.org/2000/svg" width="880" height="636" viewBox="0 0 880 636" shape-rendering="geometricPrecision">
  <title>A working ranch: a red board-sided gable barn with a louvred ridge cupola, white-trimmed windows and a sliding barn door, standing behind a peeled-log post-and-rail corral with a braced gate, one grey work horse inside it. Drawn from the Bar U Ranch National Historic Site at Longview, Alberta - one specific, cited, existing set of buildings - and simplified. The vertical ratios are MEASURED at the left gable end of refs/alberta-foothills/work-horse-barn-elevation.jpg, where the eave line is horizontal, against W = the eave height: gable rise 0.735 W, window height 0.233 W, sill 0.31 W above the foot. The plan width 1.47 W is DERIVED from a 12:12 pitch and is not a measurement; no reference in the set gives a gable end free of foreshortening, and that is written here rather than left looking like accuracy. NO LETTERING ANYWHERE and no ranch brand: this project draws no text, and an invented brand in place of the real one is what art-bible.md's 'drop, never substitute' forbids. This render is asked for a RANCH and is never asked for Alberta.</title>
