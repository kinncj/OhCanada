<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="200" viewBox="0 0 1800 200" shape-rendering="geometricPrecision">
  <title>The foothills themselves: three rolling grass ridges in the pasture ramp, aspen and spruce bluffs in the folds, and coulees cut down the near faces. World y 940..1140; the ridge line runs between world 940 and 1010 and the tile is opaque below 1010, where the front-range tile's own opaque band ends, so the seam closes at every visual tier. This tile REPEATS every 1800 px and carries no building of any kind - the level's only non-repeating anchor is the ranch barn.</title>
