<svg xmlns="http://www.w3.org/2000/svg" width="660" height="510" viewBox="0 0 660 510" shape-rendering="geometricPrecision">
  <title>An oil pump jack standing on a gravel lease in dry foothills pasture, seen from the side: a red horsehead with a curved face at the front end of a pale grey steel walking beam, the beam balanced on an A-frame Samson post with a red ladder, pitman arms running down from the beam's rear end to a crank with red counterweights on a black gear reducer, a motor and belt guard behind it on a long steel skid, and the wire-rope bridle hanging from the horsehead to the polished rod and the wellhead on the ground in front. A conventional beam pump in the red-and-grey paint of the Foothills County, Alberta unit. MEASURED against S = the height of the saddle bearing above the skid, on the side profile in refs/alberta-foothills/pump-jack-dusk-in-snow.jpg and checked on pump-jack-side-elevation.jpg: horsehead 0.62 S tall, front arm 0.70 S, rear arm 0.53 S, pitman 0.49 S, motor to wellhead 1.69 S. A TYPE, not an operator: no maker's name, no lease sign, no number and no lettering of any kind. POI hero, present at every visual tier.</title>
