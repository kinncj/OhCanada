<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" shape-rendering="geometricPrecision">
  <title>The ranch trail under the Alberta ride, seen from beside it: a grass verge with tussocks, a dry dirt wheel rut the horse walks in, and rough pasture below sinking into the ground. A repeating strip fixed to the world, so the tussocks go by under a walking horse; nothing in it crosses the tile seam. The ride track of ADR-0031. No lettering, no signage.</title>
