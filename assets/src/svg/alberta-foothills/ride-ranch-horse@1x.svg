<svg xmlns="http://www.w3.org/2000/svg" width="600" height="446" viewBox="0 0 600 446" shape-rendering="geometricPrecision">
  <title>A saddled bay ranch horse walking, seen from its near side: a quarter-horse type with a deep round barrel, a short thick neck carried forward, the head angled down, black mane, tail and lower legs, and a tan western saddle with a horn, a square skirt, a fender, a cinch and an open stirrup, on a felt pad; a plain leather bridle and one rein running back to where the rider holds it above the horn. Proportions MEASURED on assets/refs/alberta-foothills/quarter-horse-side-elevation.jpg against W = the withers height; the stride from Muybridge plate 574 (horse-walking-muybridge-plate-574.jpg); the saddle and the rider's seat from cow-horse-under-western-saddle.jpg. Never traced. The rider is the player, posed by the rig (horse/*) and drawn IN FRONT of this file, which is the behind layer of a ride (ADR-0031); the rider's sole line rests on the anchor at (258, 270), on the stirrup tread. No brand, no lettering, no outline, because it is not a character.</title>
