  <title>A ranch fence and gate of round logs: four peeled log rails running across squared timber posts and stopping at the opening, a hung gate of three lighter rails with a diagonal brace between two taller gate posts, plain strap hinges and a latch, standing in foothills pasture. A TYPE, not a named ranch: no brand, no name board, no sign, no wordmark and no lettering of any kind. Drawn from assets/refs/alberta-foothills/log-rail-fence.jpg and the yard fences in ranch-yard-and-front-range.jpg; see assets/refs/references.json, subject log-rail-gate. POI hero, present at every visual tier.</title>

