<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" shape-rendering="geometricPrecision">
  <title>Three beef cattle standing on rangeland, all facing the same way: deep barrel bodies on short legs, high rumps, thick short white necks and narrow white faces with one ear, one eye and a pale muzzle each, white underlines and white socks over dark hooves, tails hanging with a dark switch, in dry foothills grass. They are drawn to the SAME red-bodied white-faced pattern as the three small cattle already on this level's rangeland tile. CATTLE, not horses and not camelids: the neck is short and thick, the back is level, the head is small and low, and the body is deeper than the legs are long. No brand, no ear tag, no horns, no lettering. Drawn from assets/refs/alberta-foothills/rangeland-cattle-and-wire-fence.jpg; see assets/refs/references.json, subject beef-cattle. POI hero, present at every visual tier.</title>

