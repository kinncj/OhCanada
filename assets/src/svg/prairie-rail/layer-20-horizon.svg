<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="200" viewBox="0 0 1800 200" shape-rendering="geometricPrecision">
  <title>The far horizon: a poplar shelterbelt drawn as a RHYTHM of narrow lobes, two distant farmsteads - one gable barn and three steel bins each, both of them TYPES and neither of them a grain elevator - and the first bands of distant field. NO ELEVATOR ANYWHERE ON THIS TILE, and that is the rule rather than a preference: this tile repeats every 1800 px and the elevator is the level's only non-repeating anchor, so an elevator here would make the repeating layer carry the level's identity, which is the failure Toronto's tiles are written to avoid. World y 920..1120; the haze foot from world 982 down is opaque, which is what lets the sky above it be one flat field.</title>
