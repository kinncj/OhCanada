  <title>A double-stack container car standing on a siding: a steel well car on two four-wheel trucks, its deck dropped between raised ends, carrying one container in the well and a second stacked on top, each drawn as a ribbed box with corner castings and a darker end. A TYPE, not an operator: no wordmark, no reporting mark, no number, no logo, no livery and no lettering of any kind, and the two box colours are palette ramps rather than any company's. Drawn from the freight standing beside the elevator in assets/refs/prairie-rail/prairie-freight-train-at-dawn.jpg; see assets/refs/references.json, subject container-car. POI hero, present at every visual tier.</title>

