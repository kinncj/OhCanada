<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="260" viewBox="0 0 1800 260" shape-rendering="geometricPrecision">
  <title>The middle ground: a nearer poplar shelterbelt with one deliberate gap, round bales, and four bands of harvested field, with SWATHS - fourteen long cut rows laid at a slight angle across the tile, each with its own shadow line. The swaths are the point: parallel bands alone read as a striped rug, and a cut crop lying in rows at an angle to the track is what a prairie field looks like from a train. Straw is the `felt` ramp, measured at hsl(38,63%,33%) on assets/refs/prairie-rail/prairie-harvest-and-shelterbelt.jpg. World y 1010..1270; opaque from world 1120, which is where the horizon tile ends.</title>
