  <title>A combine harvester cutting standing grain: a red machine with a high glazed cab over one large drive wheel and a small rear wheel, an open grain tank on top, an unloading auger folded up over the left side, a sloping feeder house, and a wide header at the front carrying a slatted reel above a pale cutter bar, standing between cut stubble and standing wheat. A TYPE, not a make or a model: no badge, no wordmark, no model number and no lettering of any kind, and no figure in the cab. Drawn from assets/refs/prairie-rail/prairie-harvest-and-shelterbelt.jpg; see assets/refs/references.json, subject combine-harvester. POI hero, present at every visual tier.</title>

