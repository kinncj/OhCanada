<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" shape-rendering="geometricPrecision">
  <title>A combine harvester cutting standing grain: a red machine with a high glazed cab over one large drive wheel and a small rear wheel, an open grain tank on top, an unloading auger folded up over the left side, a sloping feeder house, and a WIDE HEADER reaching forward across the whole right of the frame - a low pan with a pointed crop divider at its leading edge, a pale steel cutter bar running the full width of the pan and past it at both ends, and a slatted six-bat reel turning clear above it with daylight all round. The header is the identification and it is drawn as the machine's biggest single element rather than as a box tacked on the corner: the body was moved back and shortened to make room, so the header is 228 px of an 800 px machine with open air in front of the reel instead of the 176 px stub, half-swallowed by its own reel at the frame edge, that a blind reading called a stub. Standing wheat behind, cut stubble in front. A TYPE, not a make or a model: no badge, no wordmark, no model number and no lettering of any kind, and no figure in the cab. Drawn from assets/refs/prairie-rail/prairie-harvest-and-shelterbelt.jpg; see assets/refs/references.json, subject combine-harvester. POI hero, present at every visual tier.</title>

