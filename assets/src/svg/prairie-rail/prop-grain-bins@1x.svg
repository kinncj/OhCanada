<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" shape-rendering="geometricPrecision">
  <title>A row of four hopper-bottom steel grain bins: tall narrow corrugated cylinders ringed by horizontal seams, each under a STEEP conical roof with a small peak vent, each standing clear of the ground on a funnel-shaped hopper and three steel legs with a dark void beneath it, the tallest carrying a ladder, on a gravel pad. The legs and the hopper are what make these bins and not buildings. A TYPE, not a named farm: no company name, no wordmark, no number and no lettering of any kind. Drawn from the bins beside the elevator in assets/refs/prairie-rail/prairie-freight-train-at-dawn.jpg and grain-elevator-govan-and-track.jpg; see assets/refs/references.json, subject grain-bins. POI hero, present at every visual tier.</title>

