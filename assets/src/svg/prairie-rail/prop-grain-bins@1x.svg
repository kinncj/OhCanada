<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" shape-rendering="geometricPrecision">
  <title>A row of four hopper-bottom steel grain bins: tall narrow corrugated cylinders ringed by horizontal seams, each under a STEEP conical roof with a small peak vent, each standing clear of the ground on a funnel-shaped hopper and three steel legs with a dark void beneath it, the tallest carrying a ladder, on a gravel pad with weeds along its back edge. The legs and the hopper are what make these bins and not buildings. THE STEEL IS THE `slate` RAMP AND THE PAD IS THE `stone` RAMP, and that is a correction: both were drawn from `path`, which palette.json declares the one near-neutral ramp and exempts from the saturation gain, so every shape in the render - bin, cone, hopper and gravel alike - was a flat neutral grey and the picture breached the house rule that the palette is saturated. Galvanised steel standing against a prairie sky is a cool blue-grey and the pad it stands on is warm gravel; drawn from two ramps rather than one, the cool cylinders now read against warm ground instead of dissolving into it. Each material still takes three flat tones from ONE ramp, as art-bible section 2 requires. A TYPE, not a named farm: no company name, no wordmark, no number and no lettering of any kind. Drawn from the bins beside the elevator in assets/refs/prairie-rail/prairie-freight-train-at-dawn.jpg and grain-elevator-govan-and-track.jpg; see assets/refs/references.json, subject grain-bins. POI hero, present at every visual tier.</title>

