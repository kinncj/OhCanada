  <title>The main line under the Prairies train, seen from beside it: one rail head over timber tie ends on a 48 px period and a ballast shoulder of flat chips. A repeating strip fixed to the world, so the ties go by under a moving train; ten ties to the tile, so the rhythm survives the seam. The ride track of ADR-0031. No lettering, no signage.</title>
