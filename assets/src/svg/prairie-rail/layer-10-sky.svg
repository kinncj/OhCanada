<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000" shape-rendering="geometricPrecision">
  <title>The prairie sky, and it is most of the picture: ONE FLAT sky-light field with six flat-bottomed cumulus banks, the largest clouds in the game. Flat rather than banded, for the reason Halifax's sky is: at the LOW preset this level keeps only the sky and the railbed, and the railbed is transparent everywhere above the rail head, so there is nowhere to hide a band step. One field has no step to hide and it IS the level document's theme.sky. Pale on purpose - measured at hsl(213,50%,61%) on assets/refs/prairie-rail/grain-elevator-chamberlain.jpg, and taken at sky-light so the horizon band can go to cloud-light without a visible step. FLAT BASES, which is what makes prairie cumulus prairie cumulus rather than the round cotton of the other five levels. World y 0..1000; clouds are kept inside x 100..980 so the extreme columns stay flat band colour for the desktop side panel.</title>
