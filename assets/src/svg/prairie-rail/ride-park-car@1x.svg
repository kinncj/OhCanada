<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="590" viewBox="0 0 1420 590" shape-rendering="geometricPrecision">
  <title>The rear of VIA Rail's Canadian seen from beside the line: a stainless-steel Budd Park car, the car at the tail of that train. At the left the rounded observation end, with a red marker light on its roof, a big end window and the blue letterboard band sweeping round it; a raised glass dome on the roof just ahead of it; a row of windows over a fluted lower body; two four-wheel trucks; and at the right-hand edge the coupled end of the car ahead, which the camera never reaches. The player sits in the dome and is drawn BEHIND this file, showing through the glass: this is the front layer of a ride (ADR-0031), and the rider's feet rest on its anchor at (380, 422). Drawn from assets/refs/prairie-rail/park-car-side-and-dome-jasper.jpg, park-car-observation-end-jasper.jpg and canadian-side-elevation-1981.jpg, and never traced. No wordmark, logo, car name, number or lettering of any kind: the blue band is a livery colour and not a mark. No outline, because it is not a character.</title>
