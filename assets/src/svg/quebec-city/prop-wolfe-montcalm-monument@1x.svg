  <circle cx="89" cy="459" r="4" fill="#ffffff"/>
  <circle cx="66" cy="434" r="12" fill="#f0f2f5"/>
  <circle cx="63" cy="431" r="4" fill="#ffffff"/>

  <!-- AO where the plinth meets the snow. -->
  <ellipse cx="200" cy="574" rx="104" ry="12" fill="#16203a" opacity="0.28"/>

  <!-- The shaft: a square obelisk, lit edge on the left, return face in shade on the right. -->
