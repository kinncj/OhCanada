<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" shape-rendering="geometricPrecision">
  <title>The Wolfe and Montcalm monument in the Governors' Garden, Québec City, in winter: a tall, slender, square stone obelisk in grey stone, tapering from 56 px at its foot to 30 px under a pale capstone pyramid, lit on its left edge and in shade on its right return, standing on a three-stage pedestal - a die with a projecting cornice, a low central pediment and raised corner blocks, a plain plaque panel on its face; a wider lower pedestal with a second, larger plain panel; and a broad plinth - with snow on every ledge, a snow bank at its foot, and the garden's three-globe lamp standard beside it. The shaft is about two thirds of the whole height (66 per cent on the primary reference, 63 drawn) and the height is about four times the width of the plinth. No statue, no figure, no portrait, no lettering: both plaques are drawn blank, because this project draws no text and the inscription is the only writing on the monument. No flag, no cannon, no wreath. Drawn from assets/refs/quebec-city/wolfe-montcalm-obelisk.jpg, with the die, its cornice and corner blocks and the stepped pedestal checked against wolfe-montcalm-monument-1901.jpg; every colour is from palette.json. See assets/refs/references.json, subject wolfe-montcalm. POI hero, present at every visual tier.</title>

  <!-- The garden's lamp standard, behind the monument and to the left. -->
  <rect x="62" y="446" width="8" height="126" rx="4" fill="#30384f"/>
  <rect x="62" y="446" width="3" height="126" fill="#57647a"/>
  <rect x="42" y="470" width="48" height="6" rx="3" fill="#30384f"/>
