  <rect x="150" y="383" width="16" height="5" rx="2" fill="#ffffff"/>
  <rect x="234" y="383" width="16" height="5" rx="2" fill="#e6eff7"/>
  <rect x="166" y="397" width="68" height="5" rx="2" fill="#e6eff7"/>
  <rect x="163" y="462" width="74" height="6" fill="#16203a" opacity="0.18"/>

