  <rect x="163" y="412" width="74" height="50" fill="#57647a"/>
  <rect x="163" y="412" width="10" height="50" fill="#7d8fa0"/>
  <rect x="227" y="412" width="10" height="50" fill="#30384f"/>
  <rect x="183" y="424" width="34" height="22" rx="2" fill="#f0f2f5"/>
