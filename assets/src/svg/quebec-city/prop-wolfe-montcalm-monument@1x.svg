  <rect x="152" y="408" width="96" height="5" fill="#30384f"/>
  <polygon points="166,401 200,382 234,401" fill="#7d8fa0"/>
  <polygon points="200,382 234,401 214,401" fill="#57647a"/>
  <polygon points="166,399 200,380 200,385 172,401" fill="#ffffff"/>
  <rect x="150" y="386" width="16" height="16" rx="3" fill="#7d8fa0"/>
