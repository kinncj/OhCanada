  <rect x="169.881" y="300" width="24" height="48" rx="3" fill="#0f121a"/>
  <rect x="169.881" y="300" width="24" height="5" fill="#605a55"/>

  <!-- The timber upper storey set on the drum, in the shadow of the eave, with its two small windows.
       It is round because the drum is: its foot follows the drum's top course, bowing UP in the middle
       like every course below it, and its panel joints crowd toward both edges the way the faceted storey
       in martello-tower-1.jpg turns away from the eye. A flat-bottomed box on a drum read as a blockhouse
       (blind run 7d90205061b27757); these two cues are the reference's own, not added detail. -->
  <clipPath id="storey"><path d="M 169 138 L 431 138 L 431 198 Q 300 176 169 198 Z"/></clipPath>
  <g clip-path="url(#storey)">
    <rect x="169" y="138" width="262" height="60" fill="#5a2d19"/>
