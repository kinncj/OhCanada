<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" shape-rendering="geometricPrecision">
  <title>Martello Tower 1 on the Plains of Abraham, in Battlefields Park, Québec City, in winter: a squat, round, grey stone tower, battered so its drum is wider at the foot than at the top, with sparse curved coursing that reads round, a small shuttered arched window, a raised first-floor door reached only by a straight external timber stair and a railed landing on posts, a dark timber upper storey with two small windows set on the drum, a low hipped roof with a deep eave under snow, a stone chimney, and one of the park's green iron lantern lamps in the open snow beside it. The drum is about three quarters as tall as it is wide, measured on the primary reference. No cannon, no flag, no plaque, no lettering and no figure. Drawn from assets/refs/quebec-city/martello-tower-1.jpg, with the snow-covered park and its lantern lamps from plains-of-abraham-winter.jpg; every colour is from palette.json. See assets/refs/references.json, subject martello-tower. POI hero, present at every visual tier.</title>

