    <path d="M 163.7 274 Q 300 254 436.3 274 L 436.3 280 Q 300 260 163.7 280 Z" fill="#605a55"/>
    <path d="M 161.0 316 Q 300 296 439.0 316 L 439.0 322 Q 300 302 161.0 322 Z" fill="#605a55"/>
    <path d="M 158.3 358 Q 300 338 441.7 358 L 441.7 364 Q 300 344 158.3 364 Z" fill="#605a55"/>
  </g>

  <!-- The shuttered window on the drum. -->
  <path d="M 334 340 L 334 308 A 18 18 0 0 1 370 308 L 370 340 Z" fill="#605a55"/>
  <path d="M 338 336 L 338 308 A 14 14 0 0 1 366 308 L 366 336 Z" fill="#5a2d19"/>
