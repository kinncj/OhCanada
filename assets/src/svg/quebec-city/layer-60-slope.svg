<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" shape-rendering="geometricPrecision">
  <title>The toboggan run: a packed-snow lane with two MODELLED divider ridges - a shaded far flank, a lit crest and a shaded near flank each - straight parallel runner streaks, two riders seated on flat wooden toboggans, and a near snow bank framing the bottom. THE LANE IS THE `snow` RAMP AND NOT THE `ice` RAMP, and that is a correction: drawn in `ice` it read to an unprimed verifier as a frozen ice-covered river, in the same hand-off as the Rideau Canal, and the built-chute feature was recorded absent. Survives the low preset. World y 1280..1840; local y 0 is the ground line.</title>
