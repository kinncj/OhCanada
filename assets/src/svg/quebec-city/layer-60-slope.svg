<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" shape-rendering="geometricPrecision">
  <title>The toboggan run: a packed-snow lane in three sub-lanes separated by two MODELLED divider ridges, sparse straight runner streaks, THREE riders seated on flat wooden toboggans, and a near snow bank framing the bottom. THE LANE IS THE `snow` RAMP AND NOT THE `ice` RAMP, and that correction still holds - no colour from the `ice` ramp appears anywhere in this file or in `layer-50-terrace.svg`, which was checked by grep before this redraw and is recorded because a blind audit reported the opposite. What that audit SAW was right even though its cause was wrong: the composite read as a frozen canal. The reason is that every band in the lower half ran the full width at almost the same value, so two ridges plus three lanes read as five long horizontal stripes, which is what wind-scoured river ice looks like. EACH RIDGE NOW CASTS A SHADOW. A flat pale band bounded by two slightly darker bands is a change of surface; a band with a bright crest, a shaded flank and a soft `ao-shadow` cast onto the lane below it is a thing standing up off the lane, and that is the only cue in a side view that separates a built chute from a frozen surface. The third rider is the second half of the fix: at play size one screen of this tile showed a single sledder, and a sport has to be visible more than once to be the subject. Straight, level, parallel edges throughout - a built chute, never a natural slope. Survives the low preset. World y 1280..1840; local y 0 is the ground line.</title>

