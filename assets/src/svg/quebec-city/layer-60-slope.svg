<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" shape-rendering="geometricPrecision">
  <title>The toboggan run: a packed-snow lane with two MODELLED divider ridges - a shaded far flank, a lit crest and a shaded near flank each - sparse straight runner streaks, two riders seated on flat wooden toboggans, and a near snow bank framing the bottom. THE LANE IS THE `snow` RAMP AND NOT THE `ice` RAMP, and that is an old correction that still holds: drawn in `ice` it read to an unprimed verifier as a frozen ice-covered river, in the same hand-off as the Rideau Canal. THE RUNNER STREAKS ARE THE SECOND CORRECTION, and they are why the river reading survived the first one. There were thirty-nine of them, most drawn in `snow-shade` at 0.42 opacity and several over four hundred pixels long, spread evenly across the whole lane: straight, level, parallel DARK lines from edge to edge are what wind-scoured river ice looks like, so the texture went on saying river after the colour had stopped. There are now twelve, all in `snow-light` at 0.35, none longer than three hundred pixels, and each one sits inside a single sub-lane rather than running the width of the tile - sparse marks a runner left, which is what the contract asked for and not what was drawn. The chute wall along the far side is on `layer-50-terrace.svg` and is drawn in the `wood` ramp for the same reason. Survives the low preset. World y 1280..1840; local y 0 is the ground line.</title>
