<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="950" viewBox="0 0 1080 950" shape-rendering="geometricPrecision">
  <title>Quebec City winter sky: three flat bands (sky-base zenith, sky-light, cloud-base haze) and eight soft clouds. The band colours and their order ARE palette.json levelTheme quebec-city-winter, so the medium and low presets drop this layer and get a gradient sky rather than a hole. World y 0..950. Both band steps are at 830 and 900, behind the far-bank ridge, so no hard horizontal step ever shows against open sky - which is what a first composite of this level did show. The extreme left and right columns are flat band colour so the desktop side panel has no seam.</title>
