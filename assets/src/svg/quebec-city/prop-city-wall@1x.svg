<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" shape-rendering="geometricPrecision">
  <title>A section of the city's fortified stone wall in winter: two mortared ashlar faces meeting at a salient angle, the near face lit and the returning face in shade, both battered so the wall leans back as it rises, a plain flat coping along the head with snow lying on it, corner quoins, sparse course marks rather than a drawn stone pattern, and a snow bank at the foot. NO CRENELLATION, no battlements, no arrow slits, no tower, no gate, no cannon: the wall in the reference has a plain coping and none of those. No lettering, no plaque, no flag. Drawn from assets/refs/quebec-city/quebec-ramparts-snow.jpg; see assets/refs/references.json, subject city-wall. POI hero, present at every visual tier.</title>

