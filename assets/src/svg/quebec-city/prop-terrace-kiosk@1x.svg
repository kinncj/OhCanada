<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" shape-rendering="geometricPrecision">
  <title>A striped open bandstand kiosk on a winter promenade: an octagonal pavilion of white posts on a stepped base, an open dark interior, a turned balustrade between the posts, and a shallow tented roof of radial green and white stripes under a scalloped valance, with a plain ball finial at its apex. Drawn from the kiosk in assets/refs/quebec-city/dufferin-terrace-boardwalk.jpg and the 1905 photograph dufferin-terrace-toboggan-slide-1905.jpg; see assets/refs/references.json, subject terrace-kiosk. THIS OBJECT IS FORBIDDEN ON THIS LEVEL'S TWO REPEATING PARALLAX TILES AND REQUIRED HERE: it was drawn into layer-50-terrace.svg as street furniture, an unprimed verifier named the place off it, and it was replaced there by a plain open timber shelter. A POI hero is drawn once, at one place in the world, which is where a building that names its city belongs. No lettering, no flag, no wordmark, no figure.</title>

