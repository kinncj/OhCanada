<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 300 1080 900" shape-rendering="geometricPrecision">
  <title>The Chateau Frontenac, Quebec City: long green copper roofs studded with conical turrets and dormers over red-brown brick walls with pale stone banding, and one dominant square tower under a very steep dark pyramidal roof with corbelled corner bartizans, standing on the rock of Cap Diamant above the terrace. The POI hero: present at every graphics preset, on every device.</title>
