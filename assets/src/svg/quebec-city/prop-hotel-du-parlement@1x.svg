<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" shape-rendering="geometricPrecision">
  <title>The Hôtel du Parlement, the Parliament Building of Québec, in Québec City, in winter, square on to its main façade: a long, symmetrical Second Empire stone building in pale grey stone, four storeys under a mansard roof with a row of dormers, with two projecting end pavilions each under a tall truncated slate mansard crowned with iron cresting, two lower pavilions with segmental pediments either side of the centre, and the TALL CENTRAL CLOCK TOWER rising in stages to a round clock face, arched niches, corner pinnacles, a slate mansard and an openwork iron crown. Snow lies on every cornice and ledge. The tower rises about one and a half times the height of the façade above its roofline, measured on the primary reference. No flag and no flagstaff (OQ-ART-04 is open), no lettering, no coat of arms, and NO FIGURE: the bronze statues in the façade's niches, and the bronze group in the niche at the foot of the tower, are simplified to their dark recesses and none is drawn. The modern entrance pavilion, the gardens and the fountain are not drawn. Drawn from assets/refs/quebec-city/parlement-east-facade.jpg, with the tower's roof and crown from parlement-tower-from-fountain.jpg; every colour is from palette.json. See assets/refs/references.json, subject hotel-du-parlement. POI hero, present at every visual tier.</title>

