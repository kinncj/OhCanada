<svg xmlns="http://www.w3.org/2000/svg" width="84" height="141" viewBox="22 281 84 141" shape-rendering="geometricPrecision">
  <title>The guide’s paddle tail: a broad flat scaly paddle on a stub that leaves the body at the hip and streams out behind, on the wearer’s right - which in a right-facing three-quarter pose is the trailing side. Three cross bands carry the scale as a rhythm, never as a texture fill. It is one of the two features that make a beaver identifiable at phone size.</title>
