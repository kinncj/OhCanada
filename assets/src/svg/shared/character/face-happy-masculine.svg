  <title>Face pose &quot;happy&quot; (a correct answer, a greeting), masculine presentation, three-quarter. MASCULINE presentation: heavier, flatter, lower brows, a slightly wider mouth and a jaw shadow inside the head outline. Detail inside the face only: no proportion, outline or size differs from any other option. Brows, pupils and mouth differ in SHAPE between expressions, so the pose survives greyscale, high contrast and the plain Canvas tier. Every eye carries a white catchlight so it reads on all six skin ramps. Identical geometry for every character and every skin ramp.</title>
