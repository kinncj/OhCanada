<svg xmlns="http://www.w3.org/2000/svg" width="57" height="52" viewBox="158 282 57 52" shape-rendering="geometricPrecision">
  <title>One frame serves both sides: the rig mirrors it about the character centre line. The guide's forepaw: bare dark hide, one mass and a thumb with three claw ticks, mitten-simplified exactly like every other character's hand - no separated fingers at any size (art bible 7). The thumb sits on the INNER edge so it points toward the body on both sides once the frame is mirrored.</title>
