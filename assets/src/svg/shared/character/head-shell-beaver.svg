<svg xmlns="http://www.w3.org/2000/svg" width="105" height="110" viewBox="76 29 105 110" shape-rendering="geometricPrecision">
  <title>The guide’s head, three-quarter view facing right: cranium inside the human head box, small rounded ears set low and well back at the side of the skull, and the muzzle projecting on the leading edge with two oversized white incisors hanging below the shared mouth line. Drawn above hair and below face, so the guide plays the game’s four expressions rather than a second set. The incisors are white rather than the animal’s orange: at ship size each tooth is about 4 px and an orange tooth on a felt snout pad disappears. That is a legibility exaggeration of a real feature, written down rather than left looking like accuracy.</title>
