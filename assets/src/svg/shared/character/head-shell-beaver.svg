<svg xmlns="http://www.w3.org/2000/svg" width="115" height="124" viewBox="71 16 115 124" shape-rendering="geometricPrecision">
  <title>The guide’s head, three-quarter view facing right: the same neck part as every other character - the shared `neck-{skin}` column is drawn and then covered here in pelt, exactly as the shared head and the short crop are - a cranium that ENCLOSES the shared head and the shared short crop as one mass with the outline sitting 3-4 px outside them - the crown reaches y 17 because the crop's does 20 and pelt that stops short of it shows a tan crescent of human hair through the skull, which is what happened - one small rounded ear set low and well back and drawn UNDER the cranium, and the muzzle projecting on the leading edge with two oversized white incisors hanging below the shared mouth line. Drawn above hair and below face, so the guide plays the game’s four expressions rather than a second set. The incisors are white rather than the animal’s orange: at ship size each tooth is about 4 px and an orange tooth on a felt snout pad disappears. That is a legibility exaggeration of a real feature, written down rather than left looking like accuracy.</title>
