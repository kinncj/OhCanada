  <title>The guide head, three-quarter facing right: one mass of pelt that covers the shared head, the shared short crop and the shared neck with its outline outside all three (checked by the generator), a pale cheek and throat, one small dark ear set high and well back, a broad blunt muzzle with a wide flat nose, and two white incisors hanging just below the shared mouth line - not past the chin. Drawn above hair and below face, so the guide plays the shared expressions.</title>
