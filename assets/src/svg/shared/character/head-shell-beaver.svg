  <title>The guide head, three-quarter facing right: one round mass of warm brown pelt that covers the shared head, the shared short crop and the shared neck (checked pixel by pixel by the generator), a lit crown, one small round ear set high and back on the silhouette, a soft cream bean-shaped muzzle under the shared eyes with a dark nose on its leading edge and a short line down to the shared smile, two small white incisors tucked under that smile and stopping well above the chin, and a pale throat column above the chest fur. Drawn above hair and below face, so the guide plays the shared expressions.</title>
