<svg xmlns="http://www.w3.org/2000/svg" width="92" height="95" viewBox="69 33 92 95" shape-rendering="geometricPrecision">
  <title>Hair, a chin-length bob swinging behind the ear, cut into soft tufts at the nape and the fringe, with a cowlick at the crown and strand-shaped light and shade, ramp hair-grey. Three-quarter: the mass sits behind the face plane, the ear stays clear and the fringe stops inside the forehead so the face is the leading edge. No closed shade band at the ear and no single glossy highlight: a smooth cap with a dark rim behind the ear read as a helmet shell on the skater (blind run 7d90205061b27757). Shape and colour are independent slots.</title>
