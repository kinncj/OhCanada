<svg xmlns="http://www.w3.org/2000/svg" width="69" height="44" viewBox="126 418 69 44" shape-rendering="geometricPrecision">
  <title>The guide's webbed hind foot, the wearer's left, the near side of the canonical pose. Bare dark hide, a single rounded wedge with three toe notches, a tone lighter than the tail because the sole plane faces the sky and two dark masses of one tone merge at phone size, and the web between them. Feet are the one pair that is NOT mirrored: a mirrored foot points backwards.</title>
