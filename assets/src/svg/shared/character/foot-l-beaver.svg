<svg xmlns="http://www.w3.org/2000/svg" width="59" height="47" viewBox="110 420 59 47" shape-rendering="geometricPrecision">
  <title>The guide’s webbed hind foot, a tone lighter than the paddle tail so the two do not merge into one dark mass at phone size, the wearer’s left - the FAR side of the three-quarter pose. Feet are the one pair the rig does not reflect, and in this view that is what buys the turn: both point the way the character travels, and the far one is drawn shorter and set back so it reads as depth.</title>
