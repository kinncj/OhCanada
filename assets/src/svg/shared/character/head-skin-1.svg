<svg xmlns="http://www.w3.org/2000/svg" width="92" height="89" viewBox="75 39 92 89" shape-rendering="geometricPrecision">
  <title>Head and the one visible ear in skin ramp 1. Three-quarter view turned about 25 degrees off strict profile, facing right. The turn is carried by the OUTLINE: a round cranium behind with an occiput behind the ear, and a brow, a small nose, a lip and a chin on the leading edge, the lip and chin set back behind the brow so the lower face does not read as a muzzle. Drawn 0.9 of its old size about the jaw (art-bible.md 7.2). THE NECK IS NOT HERE. Six ramps, one derivation rule, no default tone.</title>
