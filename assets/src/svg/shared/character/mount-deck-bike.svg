<svg xmlns="http://www.w3.org/2000/svg" width="240" height="176" viewBox="0 296 240 176" shape-rendering="geometricPrecision">
  <title>Bicycle, side view, facing right: two wheels, a diamond frame, a saddle, cranks and pedals, and a bar drawn wide across the three-quarter view so the far grip sits forward of the near one, where the far hand has to reach it. Wheels are 88 px across and tubes 10 px wide, which is heavier than scale, because the Toronto waterfront trail is ridden at 390 px and a 3 px tube is not a bicycle. Frame tubes are stroked twice - ink under, colour over - so every tube carries the rig's 6 px silhouette without a second path per tube. Tyre and rim follow the bicycles already drawn into `toronto/layer-40-boulevard.svg`: dark tyre, light rim, visible spokes.</title>
