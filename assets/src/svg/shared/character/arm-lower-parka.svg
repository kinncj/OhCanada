  <title>One frame serves both sides: the rig reflects it about the character centre line. Parka sleeve, lower, from the elbow to the cuff. The outline is OPEN across the top of the cap, which is drawn over the part above it: a closed cap there read as a bead at the joint. Tapered toward the joint below it, so a limb reads as a limb and not a tube.</title>
