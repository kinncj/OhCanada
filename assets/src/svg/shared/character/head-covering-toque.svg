<svg xmlns="http://www.w3.org/2000/svg" width="98" height="80" viewBox="67 3 98 80" shape-rendering="geometricPrecision">
  <title>Knitted toque, three-quarter view facing right: a snug knit crown that follows the cranium, a FOLDED CUFF in the same red a tone darker with its ribs showing, and a white pom ON TOP. It was a tall peaked cap with a white band and a pom at the back, and at phone size that is a Santa hat. THE CUFF CLEARS THE BROWS AND IT IS MEASURED: over the face (x 118-156 before the head scale) its lowest ink is 3.4 px above the highest brow ink in any expression and presentation. It runs level over the forehead and drops behind the ear, which is the three-quarter cue. Nothing here sits above y = 0.</title>
