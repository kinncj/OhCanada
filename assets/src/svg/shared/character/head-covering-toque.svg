<svg xmlns="http://www.w3.org/2000/svg" width="100" height="87" viewBox="66 1 100 87" shape-rendering="geometricPrecision">
  <title>Knitted toque with a folded band and a pom, three-quarter view facing right. The band FOLLOWS THE BROW LINE, which on a turned head runs downhill from the leading edge to the back, and the pom sits well back on the crown - a level band and a centred pom read as a front view and undo the head. The band stops ABOVE the brows: a band drawn over them hides the expression, which is the whole of a character at phone size. Every hair shape reads under it.</title>
