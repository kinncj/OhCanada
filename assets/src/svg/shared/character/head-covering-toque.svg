<svg xmlns="http://www.w3.org/2000/svg" width="109" height="89" viewBox="67 0 109 89" shape-rendering="geometricPrecision">
  <title>Knitted toque, three-quarter facing right: a snug red crown, a darker ribbed red cuff and a white pom on top. The cuff runs level over the face and clears the highest brow in every expression and presentation (checked by the generator), then drops behind the ear. THE POM IS DRAWN LARGE ON PURPOSE. Ridden on the bicycle at 390 px, a 20 px bobble is about 16 px on the trail, and a blind reading of that render reported a HELMET - which is on that subject's `neverAdd`. Nothing was removed, because there was nothing to remove: the rig offers `none` and `toque` and no helmet exists anywhere in this project's art. What the reading found is that at play size a snug red crown with a small pale bobble has the silhouette of a smooth shell, and the one thing that separates knitted headwear from a helmet - the bobble - was the part too small to do it. The pom is now 28 x 22 rather than 20 x 20, grown sideways and down rather than up so it stays inside the part window and no rig geometry moves. Colour, crown, cuff and ink are untouched.</title>
