<svg xmlns="http://www.w3.org/2000/svg" width="84" height="73" viewBox="77 34 84 73" shape-rendering="geometricPrecision">
  <title>Hair, a short crop close to the head, the mass behind the face, cut into soft tufts at the nape and the fringe with a cowlick at the crown and strand-shaped light and shade, ramp hair-blond. Three-quarter: the mass sits behind the face plane, the ear stays clear and the fringe tip stops inside the forehead so the face is the leading edge. No closed shade band at the nape and no single glossy highlight, which together read as a helmet shell in a forward-pitched pose. Shape and colour are independent slots.</title>
