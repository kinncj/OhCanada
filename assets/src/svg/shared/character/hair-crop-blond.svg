  <title>Hair, a short crop close to the head, the mass behind the face and the fringe tip inside the forehead, ramp hair-blond. Three-quarter: the mass sits behind the face plane, the ear stays clear and the fringe stops inside the forehead so the face is the leading edge. Shape and colour are independent slots.</title>
