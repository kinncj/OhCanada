<svg xmlns="http://www.w3.org/2000/svg" width="95" height="98" viewBox="70 25 95 98" shape-rendering="geometricPrecision">
  <title>Hair, a chin-length bob, the mass swinging behind the ear, ramp hair-brown. Three-quarter view: the mass sits behind the face plane and the fringe clears the brow line, because hair draws over the head and under the face. Shape and colour are independent slots: every shape is offered with every colour and with every skin tone.</title>
