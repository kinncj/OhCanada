<svg xmlns="http://www.w3.org/2000/svg" width="110" height="186" viewBox="65 116 110 186" shape-rendering="geometricPrecision">
  <title>Light cotton jacket, worn open to the hip, three-quarter facing right: a cobalt shell with a fold-down collar behind the neck, a lapel on the leading edge, a ribbed waistband and a pocket welt, over a plain crew-neck T-shirt that shows down the open front. The warm-weather costume of the player, for levels that are not winter. No hood, no fur, no scarf, no flag, no lettering and no diagonal across the chest.</title>
