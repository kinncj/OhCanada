<svg xmlns="http://www.w3.org/2000/svg" width="101" height="155" viewBox="65 21 101 155" shape-rendering="geometricPrecision">
  <title>Hair, long, falling down the back in one mass with the chest clear, ramp hair-blond. Three-quarter view: the mass sits behind the face plane and the fringe clears the brow line, because hair draws over the head and under the face. Shape and colour are independent slots: every shape is offered with every colour and with every skin tone.</title>
