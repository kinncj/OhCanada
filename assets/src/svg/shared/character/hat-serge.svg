<svg xmlns="http://www.w3.org/2000/svg" width="106" height="66" viewBox="73 2 106 66" shape-rendering="geometricPrecision">
  <title>Wide-brimmed tan felt hat, three-quarter view facing right: the flat level brim seen obliquely, so it carries MORE brim in front of the face than behind and the crown sits back over the occiput. Crown pinched to a point with a fore-and-aft crease, brown leather band with a small buckle. No badge and no lettering on the band. The brim is the single strongest read at small size, which is why it is drawn wider than feels right and why its front-back asymmetry is doing turn work as well as hat work.</title>
  <path d="M 76,47 C 76,37 96,30 124,30 C 154,30 176,39 176,49 C 176,59 152,65 122,65 C 94,65 76,58 76,47 Z" fill="#c29455" stroke="#3a2018" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <defs><clipPath id="brim"><path d="M 76,47 C 76,37 96,30 124,30 C 154,30 176,39 176,49 C 176,59 152,65 122,65 C 94,65 76,58 76,47 Z"/></clipPath></defs>
  <g clip-path="url(#brim)">
      <ellipse cx="96" cy="38" rx="30" ry="12" fill="#d5c18e"/>
      <ellipse cx="158" cy="61" rx="30" ry="12" fill="#965630"/>
  </g>
  <path d="M 84,45 C 82,23 92,5 112,5 C 132,5 148,21 150,43 C 150,51 84,53 84,45 Z" fill="#c29455" stroke="#3a2018" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <defs><clipPath id="crown"><path d="M 84,45 C 82,23 92,5 112,5 C 132,5 148,21 150,43 C 150,51 84,53 84,45 Z"/></clipPath></defs>
  <g clip-path="url(#crown)">
