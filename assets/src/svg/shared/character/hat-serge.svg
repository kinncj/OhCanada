    <path d="M 138,15 C 147,24 150,33 150,45 L 130,47 C 133,33 134,21 138,15 Z" fill="#965630"/>
    <ellipse cx="116" cy="43" rx="32" ry="8" fill="#16203a" opacity="0.18"/>
  </g>
  <path d="M 84,43 L 150,39 C 154,39 154,49 150,49 L 84,53 C 80,53 80,43 84,43 Z" fill="#7c4327" stroke="#3a2018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="126" y="38" width="12" height="12" rx="3" fill="#d6a727" stroke="#3a2018" stroke-width="2"/>
