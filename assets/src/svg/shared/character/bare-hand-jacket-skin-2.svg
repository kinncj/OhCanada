  <title>One frame serves both sides. A bare hand, skin ramp 2, worn with the light jacket: one mass and a thumb, the fingers marked by two creases rather than separated. The same 42 px hand as every mitt, gauntlet and forepaw in the rig, because a garment may add bulk and a body may not.</title>
