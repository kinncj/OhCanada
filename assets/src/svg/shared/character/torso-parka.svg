<svg xmlns="http://www.w3.org/2000/svg" width="111" height="200" viewBox="65 113 111 200" shape-rendering="geometricPrecision">
  <title>Winter parka, three-quarter view facing right: the chest and its zip line are on the leading edge, the back on the trailing edge, and the fur-trimmed hood ruff wraps the neck rather than lying flat across a front-on shoulder line. A drawcord waist and an A-line hem with a snow-white knit band keep it from reading as a rectangle at phone size. The red scarf hangs VERTICALLY down the front and never crosses shoulder to hip: a diagonal band across a chest is the officer’s cross-strap, and the two characters must not converge at small size.</title>
