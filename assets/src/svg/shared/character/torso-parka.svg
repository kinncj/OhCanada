<svg xmlns="http://www.w3.org/2000/svg" width="109" height="194" viewBox="68 120 109 194" shape-rendering="geometricPrecision">
  <title>Winter parka, three-quarter view facing right: the chest and its zip line are on the leading edge, the back on the trailing edge, and the fur-trimmed hood ruff CLOSES ROUND THE NECK: its top edge is a neck opening at y 137 and the coat’s own opening is cut lower still, so a band of fur shows between the two and the head sits on a neck instead of on the shoulders. A drawcord waist and an A-line hem with a snow-white knit band keep it from reading as a rectangle at phone size. The red scarf hangs VERTICALLY down the front and never crosses shoulder to hip: a diagonal band across a chest is the officer’s cross-strap, and the two characters must not converge at small size.</title>
