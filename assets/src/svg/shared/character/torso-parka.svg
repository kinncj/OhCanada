<svg xmlns="http://www.w3.org/2000/svg" width="110" height="214" viewBox="65 116 110 214" shape-rendering="geometricPrecision">
  <title>Winter parka, three-quarter facing right: puffed chest and a flared skirt either side of a drawcord waist with two toggles, a snow-white knit hem band, a white fur hood ruff lying behind the neck, and a red scarf wrapped at the neck with one tail hanging straight down the leading edge - never a diagonal. The shoulders are high enough to contain each sleeve cap, which is a circle on the shoulder pivot. No flag, no lettering.</title>
