<svg xmlns="http://www.w3.org/2000/svg" width="158" height="186" viewBox="41 122 158 186" shape-rendering="geometricPrecision">
  <title>Winter parka: a fur-trimmed hood ruff behind the head, sloped shoulders, a drawcord waist and an A-line hem with a snow-white knit band, over a red scarf that wraps the neck and hangs down the front. The ruff, the waist and the scarf are what stop the coat reading as a rectangle at phone size. The scarf hangs VERTICALLY and never crosses shoulder to hip: a diagonal band across a chest is the officer's cross-strap, and the two characters must not converge at small size.</title>

  <!-- hood ruff, lying across the shoulders behind the head. The head part (z 12) draws in front of it, so the lobed edge either side of the neck is what carries the read. -->
  <path d="M 56,134 A 8,8 0 0 1 72,134 A 8,8 0 0 1 88,134 A 8,8 0 0 1 104,134 A 8,8 0 0 1 120,134 A 8,8 0 0 1 136,134 A 8,8 0 0 1 152,134 A 8,8 0 0 1 168,134 A 8,8 0 0 1 184,134 L 184,146 C 168,164 72,164 56,146 Z" fill="#e6eff7" stroke="#3a2018" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <defs><clipPath id="ruff"><path d="M 56,134 A 8,8 0 0 1 72,134 A 8,8 0 0 1 88,134 A 8,8 0 0 1 104,134 A 8,8 0 0 1 120,134 A 8,8 0 0 1 136,134 A 8,8 0 0 1 152,134 A 8,8 0 0 1 168,134 A 8,8 0 0 1 184,134 L 184,146 C 168,164 72,164 56,146 Z"/></clipPath></defs>
  <g clip-path="url(#ruff)">
    <ellipse cx="70" cy="136" rx="26" ry="16" fill="#ffffff"/>
    <ellipse cx="176" cy="156" rx="26" ry="16" fill="#c2d6e8"/>
  </g>

  <!-- parka body: shoulder 148, waist 112, hem 160. The taper is the silhouette. -->
  <path d="M 120,128 C 142,128 160,132 174,140 C 188,148 194,154 192,166 C 190,182 180,204 176,228 C 172,252 190,272 194,290 C 196,300 176,304 120,304 C 64,304 44,300 46,290 C 50,272 68,252 64,228 C 60,204 50,182 48,166 C 46,154 52,148 66,140 C 80,132 98,128 120,128 Z" fill="#153f86" stroke="#3a2018" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <defs><clipPath id="parka"><path d="M 120,128 C 142,128 160,132 174,140 C 188,148 194,154 192,166 C 190,182 180,204 176,228 C 172,252 190,272 194,290 C 196,300 176,304 120,304 C 64,304 44,300 46,290 C 50,272 68,252 64,228 C 60,204 50,182 48,166 C 46,154 52,148 66,140 C 80,132 98,128 120,128 Z"/></clipPath></defs>
  <g clip-path="url(#parka)">
    <path d="M 58,146 C 72,138 80,144 78,158 C 74,182 80,210 76,236 C 72,264 60,282 56,300 L 34,300 L 34,146 Z" fill="#2275c6"/>
    <path d="M 184,150 C 170,144 164,150 166,164 C 170,188 164,212 168,238 C 172,266 182,284 186,302 L 206,302 L 206,150 Z" fill="#091740"/>
    <path d="M 34,278 C 70,272 170,272 206,278 L 206,312 L 34,312 Z" fill="#e6eff7"/>
    <path d="M 34,296 C 70,292 170,292 206,296 L 206,312 L 34,312 Z" fill="#c2d6e8"/>
    <ellipse cx="120" cy="142" rx="58" ry="22" fill="#16203a" opacity="0.18"/>
    <ellipse cx="120" cy="284" rx="76" ry="14" fill="#16203a" opacity="0.18"/>
    <ellipse cx="98" cy="186" rx="20" ry="40" fill="#2275c6"/>
    <path d="M 56,230 C 82,242 158,242 184,230" fill="none" stroke="#3a2018" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="82" cy="242" rx="7" ry="7" fill="#e6eff7" stroke="#3a2018" stroke-width="3"/>
    <ellipse cx="152" cy="242" rx="7" ry="7" fill="#e6eff7" stroke="#3a2018" stroke-width="3"/>
