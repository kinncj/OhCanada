<svg xmlns="http://www.w3.org/2000/svg" width="89" height="81" viewBox="70 29 89 81" shape-rendering="geometricPrecision">
  <title>Hair, rounded coils worn close, drawn as a scalloped silhouette over the crown and the back, never as a texture fill, ramp hair-grey. Three-quarter: the mass sits behind the face plane, the ear stays clear and the fringe stops inside the forehead so the face is the leading edge. Shape and colour are independent slots.</title>
