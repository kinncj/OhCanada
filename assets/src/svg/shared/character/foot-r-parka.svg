  <title>Winter boot, brown leather with a knit cuff and a moulded rubber sole, the wearer’s right - the NEAR side of the three-quarter pose. Feet are the one pair the rig does not reflect, and in this view that is what buys the turn: both point the way the character travels, and the far one is drawn full length on the near side.</title>
