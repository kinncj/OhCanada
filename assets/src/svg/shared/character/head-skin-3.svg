<svg xmlns="http://www.w3.org/2000/svg" width="95" height="100" viewBox="76 35 95 100" shape-rendering="geometricPrecision">
  <title>Head, neck and the one visible ear in skin ramp 3. Three-quarter view turned about 25 degrees off strict profile, facing right - further than the torso, because a walking head leads the body. The turn is carried by the OUTLINE: a big smooth cranium behind, and a brow, nose, lip and chin profile on the leading edge. One ear, set well back. Cranium wider than jaw, never a circle. Six ramps, one derivation rule, no default tone.</title>
