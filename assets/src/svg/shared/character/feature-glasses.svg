  <title>Glasses, three-quarter view facing right: the far lens is foreshortened and the temple arm runs back to the ear on the near side. The lens glint is white and sits clear of the pupil, so it reads on all six skin ramps. A cosmetic feature that works in every locomotion mode the game has.</title>
