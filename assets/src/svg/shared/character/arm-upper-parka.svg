<svg xmlns="http://www.w3.org/2000/svg" width="56" height="111" viewBox="150 133 56 111" shape-rendering="geometricPrecision">
  <title>One frame serves both sides: the rig mirrors it about the character centre line. Parka sleeve, upper: a down-filled tube with two quilt seams, leaning slightly away from the body so the arm is not parallel to the coat. The outline is OPEN across the top centre so the shoulder reads as part of the coat rather than a capsule bolted onto it; the gap sits inside the torso silhouette at every angle the walk cycle reaches.</title>
