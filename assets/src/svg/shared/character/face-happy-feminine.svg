  <title>Face, expression &quot;happy&quot;, feminine presentation, three-quarter. Two white eyes with ink pupils and a catchlight, so it reads on all six skin ramps; brows, pupils and mouth change SHAPE between expressions. Feminine: finer arched brows, a lash at the outer corner of each eye, a lower-lip mark and a cheek tint. Face detail only: no proportion, outline or size differs from any other option.</title>
