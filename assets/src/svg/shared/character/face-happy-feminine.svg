<svg xmlns="http://www.w3.org/2000/svg" width="67" height="69" viewBox="98 55 67 69" shape-rendering="geometricPrecision">
  <title>Face pose &quot;happy&quot; (a correct answer, a greeting), feminine presentation, three-quarter. FEMININE presentation: finer, higher-arched brows, lashes at the outer corner of each eye, a lower-lip mark and a cheek tint. Detail inside the face only: no proportion, outline or size differs from any other option. Brows, pupils and mouth differ in SHAPE between expressions, so the pose survives greyscale, high contrast and the plain Canvas tier. Every eye carries a white catchlight so it reads on all six skin ramps. Identical geometry for every character and every skin ramp.</title>
