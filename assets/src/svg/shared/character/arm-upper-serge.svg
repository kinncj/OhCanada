<svg xmlns="http://www.w3.org/2000/svg" width="44" height="114" viewBox="115 135 44 114" shape-rendering="geometricPrecision">
  <title>One frame serves both sides: the rig reflects it about the character centre line, which is why it hangs straight and is symmetric about its own axis - a leaning sleeve would cross its own mirrored copy. Scarlet tunic sleeve, upper. The outline is OPEN across the top so the shoulder reads as part of the garment rather than a capsule bolted onto it; the gap sits inside the torso silhouette at every angle the walk cycle reaches.</title>
