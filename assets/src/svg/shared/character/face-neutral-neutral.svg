<svg xmlns="http://www.w3.org/2000/svg" width="67" height="69" viewBox="98 55 67 69" shape-rendering="geometricPrecision">
  <title>Face pose &quot;neutral&quot; (at rest), neutral presentation, three-quarter. NEUTRAL presentation: medium brows and no added face detail. A real option with its own look, not the absence of a choice. Brows, pupils and mouth differ in SHAPE between expressions, so the pose survives greyscale, high contrast and the plain Canvas tier. Every eye carries a white catchlight so it reads on all six skin ramps. Identical geometry for every character and every skin ramp.</title>
