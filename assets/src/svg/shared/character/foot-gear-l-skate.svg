  <path d="M 155,449 L 169,449 L 167,459 L 157,459 Z" fill="#57647a" stroke="#3a2018" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 120,455 L 180,455 C 186,455 186,467 180,467 L 120,467 C 114,467 114,455 120,455 Z" fill="#7d8fa0" stroke="#3a2018" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <defs><clipPath id="sk-l"><path d="M 120,455 L 180,455 C 186,455 186,467 180,467 L 120,467 C 114,467 114,455 120,455 Z"/></clipPath></defs>
