<svg xmlns="http://www.w3.org/2000/svg" width="78" height="25" viewBox="111 445 78 25" shape-rendering="geometricPrecision">
  <title>Ice skate under the wearer’s left boot - the FAR side of the three-quarter pose, drawn 20 px shorter than the near one so the pair reads as depth, exactly as the two boots do. Same two holder posts and one runner, and the runner sits at the near skate’s height rather than the far boot’s, so both blades ride one ice line.</title>
