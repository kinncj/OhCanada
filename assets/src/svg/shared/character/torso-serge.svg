<svg xmlns="http://www.w3.org/2000/svg" width="106" height="179" viewBox="67 126 106 179" shape-rendering="geometricPrecision">
  <title>Scarlet tunic in review order, three-quarter facing right: fitted to a belted waist and flaring into a short skirt, a navy standing collar at the base of the neck, navy shoulder straps, pointed breast-pocket flaps, a single row of brass buttons, a brown Sam Browne belt with its cross-strap from the wearer right shoulder to the left hip, and a white lanyard. No crest, badge, lettering, collar dogs, shoulder flashes, chevrons or service numbers: the insignia are protected marks. Never named as a real force.</title>
