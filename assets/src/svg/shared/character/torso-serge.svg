<svg xmlns="http://www.w3.org/2000/svg" width="106" height="183" viewBox="70 118 106 183" shape-rendering="geometricPrecision">
  <title>Scarlet tunic in review order, three-quarter view facing right: standing collar and shoulder straps in midnight blue, one row of brass buttons down the chest plane on the leading edge, two pointed pocket flaps, a Sam Browne belt whose diagonal runs from the wearer’s right shoulder (the near one, trailing) down to the left hip (the far one, leading), and a white lanyard. No crest, no badge, no lettering, no collar dogs, no shoulder flashes, no rank chevrons, no service numbers: the insignia are protected marks and their absence is a legal constraint, not an oversight. Never named as a real force.</title>
