<svg xmlns="http://www.w3.org/2000/svg" width="162" height="180" viewBox="39 120 162 180" shape-rendering="geometricPrecision">
  <title>Scarlet tunic in review order: standing collar and shoulder straps in midnight blue, one row of brass buttons, two pointed pocket flaps, a Sam Browne belt with its diagonal from the wearer&apos;s right shoulder, and a white lanyard. No crest, no badge, no lettering, no collar dogs, no shoulder flashes, no rank chevrons, no service numbers: the insignia are protected marks and their absence is a legal constraint, not an oversight. Never named as a real force.</title>
