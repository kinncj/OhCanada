<svg xmlns="http://www.w3.org/2000/svg" width="118" height="250" viewBox="61 126 118 250" shape-rendering="geometricPrecision">
  <title>The guide body, three-quarter facing right: a pear of warm brown pelt, narrow at the chest and full and low at the belly and rump, with its hem below the knee so only the shins show. A cream front runs from the throat and swells into a round belly on the leading edge. No clothing of any kind. Same shoulder line, pivots and 116 px rest cap as every other character.</title>
