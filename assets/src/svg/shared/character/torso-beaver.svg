<svg xmlns="http://www.w3.org/2000/svg" width="114" height="187" viewBox="62 123 114 187" shape-rendering="geometricPrecision">
  <title>The guide’s body, three-quarter view facing right: a barrel of pelt with the pale belly on the leading edge, narrow at the shoulder and full at the waist - the opposite taper to a coat, which is what makes the silhouette read as an animal rather than a person in a suit. Same crown, sole, shoulder and hip envelope as every other character.</title>
