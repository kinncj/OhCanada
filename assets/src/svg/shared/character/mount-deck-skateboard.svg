<svg xmlns="http://www.w3.org/2000/svg" width="152" height="42" viewBox="42 429 152 42" shape-rendering="geometricPrecision">
  <title>Skateboard, side view, facing right. Deck with a kicked nose and tail, two trucks and two wheels; the wheels are drawn 16 px across rather than to scale, because a scale wheel is 5 px at design resolution and under 2 px on a phone. The board is one part and the rider stands ON it, so it draws behind the boots. Vancouver seawall: assets/style/vancouver-level.md.</title>
