<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" shape-rendering="geometricPrecision">
  <title>Kingston City Hall, on the harbour, square on to its harbour front as photographed in 2017: a long two-storey building of pale grey limestone with a projecting portico of four tall columns under a triangular pediment and a round-arched door, long wings of round-headed upper windows over a rusticated ground storey, a taller end pavilion at each end, a small white cupola with a dark cap on each wing roof, and over the centre the DOME: a white drum ringed by pilasters and tall windows, a dark bronze-brown dome carrying a white clock face on its front and on each side, and a white lantern with a small dark cap and a finial; the weathervane on the finial is simplified away. The wings carry four bays each where the real ones carry more (rhythm, not count). NO STATUE and NO FIGURE of any kind, no flag or flagstaff (OQ-ART-04), no crest, coat of arms, plaque or lettering, and none of the park in front of it (the arch, the fountain, the flower beds). Drawn from assets/refs/kingston/city-hall-harbour-front-2017.jpg, the dome from city-hall-dome-and-clocks-2011.jpg and the end pavilion from city-hall-ontario-street-side-2017.jpg. Every colour is from palette.json. See assets/refs/references.json, subject kingston-city-hall. POI hero, present at every visual tier.</title>
