<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" shape-rendering="geometricPrecision">
  <title>The Kingston Mills locks on the Rideau Canal, looking up a lock chamber at its upper gates, in summer, as photographed in 2010 and in 1898-1920: two coursed grey limestone chamber walls with pale coping, their inner faces receding into the chamber, a PAIR OF TIMBER MITRE GATES meeting on a centre seam, planked and crossed by heavier horizontal rails, a timber walkway across the gate heads with a black iron railing, a stone breast wall under the gates, and water in the chamber. On the right, a flight of stone steps rises from the coping with an iron handrail, and a black iron bollard stands on the coping. Behind, on the grassy bank, the white clapboard lockstation house with green window trim and a dark roof, and broadleaf trees. NO FIGURE of any kind (no lock staff, visitor or boater), NO BOAT, no flag, no plaque, sign, lettering or lock number, and no railway bridge or blockhouse, because no photograph of either under an accepted licence shows its present state. Drawn from assets/refs/kingston/kingston-mills-upper-gate-2010.jpg, checked against kingston-mills-railway-bridge-and-locks-1900s.jpg and kingston-mills-lock-and-basin-1900s.jpg. Every colour is from palette.json. See assets/refs/references.json, subject kingston-mills. POI hero, present at every visual tier.</title>
