  <title>A maple in full autumn colour on a city promenade: a broad rounded crown of deep and lit red foliage carried on a short trunk with three heavy branches, standing in a kerbed tree pit of bare soil, with five fallen maple leaves on the paving around it. NO FLAG, no pole, no emblem, no banner, no lettering and no figure: the leaves here are leaves on a tree and on the ground, and nothing in this file is a device on a field. Drawn to the street trees and autumn colour in assets/refs/winnipeg/cmhr-from-the-forks-tower.jpg and cmhr-at-the-forks.jpg; see assets/refs/references.json, subject autumn-maple. POI hero, present at every visual tier.</title>

