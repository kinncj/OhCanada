  <title>The near end of a cable-stayed footbridge: one white mast leaning out over the span from a masonry pier, a fan of straight cables from its head down to the deck on the long side and three short back-stays on the other, a flat white deck with a tubular guard rail on posts, and the river running under it to a paved landing. No lettering, no plaque, no flag, no figure, no traffic. Drawn from assets/refs/winnipeg/cmhr-from-esplanade-riel.jpg; see assets/refs/references.json, subject cable-stayed-bridge. POI hero, present at every visual tier.</title>

