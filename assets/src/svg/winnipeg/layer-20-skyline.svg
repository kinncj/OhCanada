  <title>Winnipeg's downtown seen across the river flats: twenty-one generic masses in pale concrete, dark glass and blue-green glass, with flat tops, arrises, storey banding and plant enclosures, standing out of an opaque haze band. GENERIC BY CONSTRUCTION - this tile repeats every 1800 px, so not one of these is a recognisable building and none of them is the landmark: the landmark is a separate, non-repeating POI hero and is the only thing in this level that names a city. Massing and rhythm only, never a grid of window panes. World y 620..880; the haze foot from world 830 down is opaque, which is what stops a column of sky dropping through between two towers.</title>
