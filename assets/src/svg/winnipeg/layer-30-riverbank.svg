<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="320" viewBox="0 0 1800 320" shape-rendering="geometricPrecision">
  <title>The far bank of the river from The Forks in early autumn, and the open water below it: a massed canopy of elm and ash in gold and green as a RHYTHM of rounded lobes, never a leaf texture (art-bible section 1), a grass and mud bank, and three flat water tones with straight ripple bars. Opaque from its top edge, which is what lets the sky layer above it be one flat field with no step to hide. Nothing on this tile is a named or recognisable place: it repeats every 1800 px and carries no building at all. World y 850..1170; the waterline is at world 1026 and the near edge of the water is covered from world 1150 by the plaza tile's parapet.</title>
