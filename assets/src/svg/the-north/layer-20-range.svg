<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="250" viewBox="0 0 1760 250" shape-rendering="geometricPrecision">
  <title>The far range across the Yukon River valley: a snow-notched saw-tooth back range in the `ice` ramp with `snow` caps, a nearer rounded ridge below it, and a dark spruce-covered foot. World y 600..850. NOT A GRADED SUBJECT and deliberately so, for the reason assets/style/alberta-foothills-level.md gives for the Rocky Mountain front: a saw-tooth range identifies a landform and not a place, and this tile repeats every 1760 px. Nothing on it is a particular mountain and no peak is named anywhere. `ice` is the palette's hazy-distance ramp, used the same way on the vancouver and peggys-cove levels.</title>
