<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" shape-rendering="geometricPrecision">
  <title>A Yukon River sternwheeler: a long, low, white, three-deck river freighter with a large ochre paddlewheel at the stern, four tall black hog posts and their truss rods, one tall ochre smokestack and a small white pilot house forward, drawn standing on the gravel bar. POI hero, non-repeating, 1x pinned, 920 x 280 with the hull 86 deep from the main deck to the keel. MEASURED on refs/the-north/sternwheeler-broadside.jpg, which is the one reference that shows the whole vessel square on, with the hull depth (main deck y495 to keel y600) = 105 px as the denominator. The identification is in three ratios: the paddlewheel is 1.80 hull depths across, the hog posts stand 1.93 hull depths above the deck and are the tallest thing on the boat, and the whole vessel is 9.7 hull depths long. A paddle steamer drawn with a small wheel and no hog posts is a Mississippi showboat, which this is not. ONE DEPARTURE, STATED: the wheel's axle is drawn 9 px below the deck line where the reference has it 46 below, because the real wheel's lowest point is under the keel and this render's bottom edge IS the ground the vessel stands on. The DIAMETER ratio, which is the identification, is kept exactly. NO LETTERING ANYWHERE. The vessel carries its own name in large letters on the bow and on the pilot house in every reference, and it is the single most identifying thing in those photographs; this project draws no text, so it ships blank and its blind contract is never asked for a name. That is the grain elevator's outcome on assets/style/prairie-rail-level.md and the reason is the same.</title>
