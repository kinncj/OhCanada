<svg xmlns="http://www.w3.org/2000/svg" width="620" height="760" viewBox="0 0 620 760" shape-rendering="geometricPrecision">
  <title>A stand of five northern spruce on a river bank: narrow spire-topped conifers of five different heights, each built from stacked drooping tiers on a short bare trunk, standing on a gravel bank with three boulders. Trees, and nothing else: no cabin, no camp, no track, no marker, no cairn, no inuksuk, no figure at any scale, and nothing built by anybody - assets/style/the-north-level.md and docs/content-review.md. Drawn from assets/refs/the-north/yukon-river-and-spruce.jpg and yukon-river-valley.jpg; see assets/refs/references.json, subject spruce-stand. POI hero, present at every visual tier.</title>

