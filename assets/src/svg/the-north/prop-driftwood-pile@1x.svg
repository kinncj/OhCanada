<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" shape-rendering="geometricPrecision">
  <title>A pile of bleached driftwood on a river gravel bar: seven barkless spars of different lengths and diameters lying ACROSS one another at seven different angles, none parallel and none steeper than twenty degrees, among rounded cobbles. EVERY LOG TAPERS AND EVERY END IS TORN. That is the correction this build exists for: the previous pile drew each log as a straight constant-width lozenge capped with a dark ELLIPSE, and a blind reading called it a stack of cut logs whose ends read as cut end-grain - which is exactly what a dark disc on the end of a cylinder is. There is no ellipse on any end now. Each spar narrows toward both ends and each end is a slanted, uneven wedge in the ramp's shade tone, broken at a different angle from the one opposite it, so the ends read as wood a river snapped rather than as wood a saw faced. The bodies run across the pale ends of the `limestone`, `stone` and `path` ramps - three warm-tan, three silver-tan and one neutral - so the pile carries sun-bleached warmth instead of reading as one flat grey card. No bark, no green wood, no cut or tool mark anywhere. Natural debris, and nothing else: the logs are LYING, none is stood up, leaned, stacked into a frame or squared off, the root fan is asymmetric and has four roots of four lengths over seventy-six degrees on ONE side so it cannot read as a radial device, and there is no cairn, no inuksuk, no marker, no structure, no shelter, no fish weir and no figure at any scale - assets/style/the-north-level.md and docs/content-review.md. Drawn from the driftwood along the shore in assets/refs/the-north/yukon-river-bluff-and-aspen.jpg and the bars in yukon-river-valley.jpg; see assets/refs/references.json, subject driftwood-pile. POI hero, present at every visual tier.</title>

