<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" shape-rendering="geometricPrecision">
  <title>A pile of bleached driftwood on a river gravel bar: seven barkless logs of different lengths lying across one another at different angles, pale grey-white with darker cut ends, one still carrying a short uneven root fan, among rounded cobbles. Natural debris, and nothing else: the logs are LYING, none is stood up, leaned, stacked into a frame or arranged, the root fan is asymmetric and has four roots so it cannot read as a radial device, and there is no cairn, no inuksuk, no marker, no structure, no shelter, no fish weir and no figure at any scale - assets/style/the-north-level.md and docs/content-review.md. Drawn from the driftwood along the shore in assets/refs/the-north/yukon-river-bluff-and-aspen.jpg and the bars in yukon-river-valley.jpg; see assets/refs/references.json, subject driftwood-pile. POI hero, present at every visual tier.</title>

