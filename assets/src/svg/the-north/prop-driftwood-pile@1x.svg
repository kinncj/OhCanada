<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" shape-rendering="geometricPrecision">
  <title>A pile of bleached driftwood on a river gravel bar: seven barkless logs of different lengths and diameters lying ACROSS one another at seven different angles, none of them parallel and none steeper than twenty degrees, each a pale sun-silvered cylinder with a darker weathered end, one still carrying a short uneven root fan, among rounded cobbles. The wood is bleached rather than brown - no bark, no green wood, no cut or tool mark anywhere - but it is sun-warmed rather than neutral: the bodies run across the pale ends of the `limestone`, `stone` and `path` ramps so the pile carries warmth instead of reading as one flat grey card. Natural debris, and nothing else: the logs are LYING, none is stood up, leaned, stacked into a frame or squared off, the root fan is asymmetric and has four roots over less than half a turn so it cannot read as a radial device, and there is no cairn, no inuksuk, no marker, no structure, no shelter, no fish weir and no figure at any scale - assets/style/the-north-level.md and docs/content-review.md. Drawn from the driftwood along the shore in assets/refs/the-north/yukon-river-bluff-and-aspen.jpg and the bars in yukon-river-valley.jpg; see assets/refs/references.json, subject driftwood-pile. POI hero, present at every visual tier.</title>

