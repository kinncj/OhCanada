<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" shape-rendering="geometricPrecision">
  <title>A deep, clear, cold high-latitude sky over the Yukon River valley: ONE FLAT sky-shade field with five groups of LENTICULAR cloud stacks - smooth stacked lens shapes with pointed ends, the mountain-wave cloud a high range makes, largest low and near the peaks and smaller higher up. Lenticular rather than cumulus, cirrus, banks or rolls, because the other six skies in this game have taken those and a seventh cumulus would be unreadable against three of them. World y 0..900. FLAT, NOT BANDED: at the low preset this level keeps the sky and the river-and-bar tile, whose first opaque row is world 960, so a band step anywhere in this tile would show against open sky. The flat field IS content/levels/the-north.json theme.sky. No stack touches x 0 or x 1080, so the desktop side-panel seam is flat sky-shade.</title>
