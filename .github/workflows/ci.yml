# This file is the only copy. It used to be a generated duplicate of
# infra/github/workflows/ci.yml, kept in step by a `sync-workflows` Makefile
# target and policed by scripts/deploy-check.mjs. The mirror, the target and the
# drift check are all gone -- do not go looking for `make sync-workflows`, it
# does not exist; infra/README.md says why it was removed. Edit this file
# directly. Ownership is enforced by .github/CODEOWNERS,
# which is where it belongs, not by which directory the file sits in.
#
# Pull requests only. `push: main` used to be here too, but deploy-pages.yml now
# runs this same gate set before it publishes, so a second copy on the same
# trigger would only double the queue and split the signal across two workflows.
#
# ACTION MAJORS
# Every `actions/*` pin here runs on the Node 24 runtime. The Node 20 runtime is
# deprecated and the runner was already forcing these actions onto Node 24 with
# a warning, so the bump removes the annotation rather than changing behaviour.
# `setup-node` v5 added automatic caching and v6 narrowed it to npm; both are
# moot here because `cache: npm` is set explicitly and package.json declares no
# `packageManager` field. `upload-artifact` v7 added an `archive` input that
# defaults to `true`, i.e. the v4 behaviour, and still honours
# `if-no-files-found` and `retention-days`. Artifact names are unique within a
# run, so the v4+ "no overwriting an existing artifact" rule does not bite.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# JOB NAMES ARE LOAD-BEARING - DO NOT RENAME WITHOUT READING THIS
# The `name:` of each job below is a *required status check* on `main` (classic
# branch protection, set 2026-09-08; docs/runbook.md 3). The required contexts
# are those two strings, character for character:
#
#     "Lint, types, unit tests, content"
#     "Build, e2e, perf, a11y"
#
# GitHub matches a required check by name and waits forever for one that never
# reports. So renaming a job here, splitting one in two, or adding a third gate
# job without updating the branch protection wedges EVERY open pull request on
# "Expected - Waiting for status to be reported", with no error anywhere. It
# fails silent, not loud.
#
# If you change a `name:`, update the contexts in the same change:
#   gh api repos/kinncj/OhCanada/branches/main/protection \
#     --jq '.required_status_checks.contexts[]'
jobs:
  static:
    name: Lint, types, unit tests, content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: make setup

      - name: Lint, typecheck, test, validate and verify content and art
        run: make lint typecheck test validate-content verify-content verify-art

      # 14 days, not the 90-day repository default and not the 3 days this was
      # cut to during the artifact-quota incident. 3 days was a quota measure and
      # the quota is gone (docs/runbook.md 3); what is left is the only question
      # that matters - how long before someone reads it. That is a review cycle,
      # and a pull request from an outside contributor can easily sit a week.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Build, e2e, perf, a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: make setup

      # `assets` is included so a pull request builds exactly what
      # deploy-pages.yml builds; without it CI would be checking a different
      # dist/ from the one that ships.
      - name: Build and run the browser suites
        run: make assets build test-e2e test-perf test-a11y

      # On failure only, and one artifact rather than two. `test-results/` used to
      # be uploaded alongside this; the HTML reporter copies every attachment it
      # references into `playwright-report/data/`, so the pair roughly doubled the
      # bytes for one run's evidence and the second copy was browsable only by
      # hand. The report is self-contained - open index.html, click the failing
      # test, the trace viewer loads from within it.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
