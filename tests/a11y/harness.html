<!doctype html>
<html lang="en" data-tn-harness="1">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>TrueNorth screen harness</title>
    <style>
      /*
        The page chrome from index.html, trimmed to what a DOM screen needs: an
        opaque page so colour contrast is computable rather than "incomplete",
        the same #game / #ui split, and the same pointer rules.
      */
      html {
        height: 100%;
        background-color: #060d16;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #060d16;
        color: #e9f1f8;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      #game { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <!-- Stands in for the Phaser canvas, which is aria-hidden by contract. -->
    <div id="game"><canvas aria-hidden="true" width="10" height="10"></canvas></div>
    <div id="ui"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
